      const as = parseInt(document.getElementById('emAS')?.value ?? '', 10);
      if (!home || !away){ alert('Both teams must be selected.'); break; }
      if (home === away){ alert('A team cannot play itself.'); break; }
      if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0 || hs > 99 || as > 99){ alert('Enter whole-number goals from 0 to 99.'); break; }
      if (hasDuplicateMatch(t, home, away, m.id)){ alert('That exact fixture already exists elsewhere.'); break; }
      const ng = groupOfTeam(t, home); if (ng) m.groupId = ng.id;
      const kickRaw = document.getElementById('emKickoff')?.value;
      m.homeId = home; m.awayId = away; m.homeGoals = hs; m.awayGoals = as;
      m.kickoff = kickRaw ? localInputToIso(kickRaw) : '';
      stripGroupLegs(m);
      const seeded = seedPendingBracket(t);
      editingMatchId = null; flash = '✅ Match updated.' + (seeded ? ' Group stage complete — knockout bracket seeded.' : '');
      logMsg = 'Updated result: ' + teamName(t, home) + ' ' + hs + '-' + as + ' ' + teamName(t, away) + (seeded ? ' (bracket seeded)' : '');
      break;
    }
    case 'delete-match': {
      if (confirm('Delete this match result?')){
        const dm = t.matches.find(x => x.id === elId);
        t.matches = t.matches.filter(x => x.id !== elId);
        editingMatchId = null; flash = '🗑️ Match deleted.';
        logMsg = dm ? 'Deleted result: ' + teamName(t, dm.homeId) + ' vs ' + teamName(t, dm.awayId) : 'Deleted a match result';
      }
      break;
    }
    case 'seed-bracket': {
      if (!t || !t.knockouts || !t.knockouts.config || !t.knockouts.config.pending) break;
      if (!groupStageComplete(t)){ alert('Finish every group fixture first — the bracket seeds from the group tables.'); break; }
      if (!seedPendingBracket(t)){ alert('The bracket could not be seeded. Check the qualification counts and team count.'); break; }
      flash = '🎯 Knockout bracket seeded from the group tables.';
      logMsg = 'Seeded the knockout bracket from the group tables';
      break;
    }
    case 'create-bracket': {
      if (!t || allTeams(t).length < 2){ alert('Add teams first.'); break; }
      const counts = readCounts(t);
      const wildcards = Math.max(0, view.wildcards || 0);
      const total = groupsOf(t).reduce((s, g) => s + counts[g.id], 0) + wildcards;
      if (!VALID_N.includes(total) || total > allTeams(t).length){
        alert('The total number of qualifiers must be one of 2, 4, 8, 16 or 32 (or 64) and can not exceed the number of teams.');
        break;
      }
      const ordered = autoPicks(t, counts, wildcards);
      const seed = seedOrder(total);
      const picks = seed.map((k, i) => {
        const ovr = view.pickOverrides && view.pickOverrides[i];
        return (ovr && teamById(t, ovr)) ? ovr : (ordered[k] || '');
      });
      if (picks.some(p => !p)){ alert('Every qualifier slot needs a team — fill the empty selects first.'); break; }
      if (new Set(picks).size !== total){ alert('Each team can only appear once in the bracket.'); break; }
      const rounds = makeRounds(total);
      for (let i = 0; i < total / 2; i++){ rounds[0][i].homeId = picks[i*2]; rounds[0][i].awayId = picks[i*2+1]; }
      t.knockouts = { config: { counts, wildcards, roundModes: defaultRoundModes(total), rules: Object.assign({}, KO_DEFAULT_RULES) }, rounds };
      autoAdvance(t);
      view.pickOverrides = {};
      flash = '📋 Knockout bracket created (' + total + ' teams) — record the results!';
      logMsg = 'Created the knockout bracket (' + total + ' teams)';
      break;
    }
    case 'save-ko-match': {
      if (!t || !t.knockouts) break;
      const found = koFindTie(t, elId);
      if (!found) break;
      const m = found.m, roundIdx = found.roundIdx;
      const originalTie = Object.assign({}, m);
      const q = sel => { const n = document.querySelector(sel); return n && typeof n.value === 'string' ? n.value : ''; };
      const home = String(q('[data-ko-home="' + elId + '"]') || '').trim();
      const away = String(q('[data-ko-away="' + elId + '"]') || '').trim();
      const hsRaw = q('[data-ko-hs="' + elId + '"]');
      const asRaw = q('[data-ko-as="' + elId + '"]');
      const l2hRaw = q('[data-ko-l2h="' + elId + '"]');
      const l2aRaw = q('[data-ko-l2a="' + elId + '"]');
      const etHRaw = q('[data-ko-et-h="' + elId + '"]');
      const etARaw = q('[data-ko-et-a="' + elId + '"]');
      const penHRaw = q('[data-ko-penh="' + elId + '"]');
      const penARaw = q('[data-ko-pena="' + elId + '"]');
      const kickRaw = q('[data-ko-kickoff="' + elId + '"]');
      if (home && away && home === away){ alert('A team cannot play itself.'); break; }
      const readScore = (raw, label) => {
        const s = String(raw == null ? '' : raw).trim();
        if (!s) return { empty: true, value: null };
        if (!/^\d+$/.test(s)){ alert(label + ' must be a whole number of 0 or more.'); return null; }
        const n = Number(s);
        if (n > 99){ alert(label + ' looks too high. Please enter a score under 100.'); return null; }
        return { empty: false, value: n };
      };
      const s1h = readScore(hsRaw, 'Leg 1 home score'); if (!s1h) break;
      const s1a = readScore(asRaw, 'Leg 1 away score'); if (!s1a) break;
      const s2h = readScore(l2hRaw, 'Leg 2 home score'); if (!s2h) break;
      const s2a = readScore(l2aRaw, 'Leg 2 away score'); if (!s2a) break;
      const etH = readScore(etHRaw, 'Extra-time home goals'); if (!etH) break;
      const etA = readScore(etARaw, 'Extra-time away goals'); if (!etA) break;
      const ph = readScore(penHRaw, 'Penalty home score'); if (!ph) break;
      const pa = readScore(penARaw, 'Penalty away score'); if (!pa) break;
      if (s1h.empty && (!ph.empty || !pa.empty || !etH.empty || !etA.empty)){ alert('Enter the match score before adding extra time or penalties.'); break; }
      if (!home || !away){
        m.homeId = home || null; m.awayId = away || null;
        clearTieResult(m);
        autoAdvance(t);
        flash = 'Knockout teams updated. Add both teams before recording a result.';
        logMsg = 'Updated a knockout tie';
        break;
      }
      const mode = roundModeFor(t, roundIdx);
      const rules = knockoutRules(t);
      if ((s1h.empty !== s1a.empty)){ alert('Enter both Leg 1 scores, or leave both blank.'); break; }
      if (mode === 'two'){
        if (!s1h.empty && !s2h.empty && (s2h.empty !== s2a.empty)){ alert('Enter both Leg 2 scores, or leave both blank.'); break; }
        if (s1h.empty && (!s2h.empty || !s2a.empty)){ alert('Leg 2 cannot be entered until Leg 1 has a result.'); break; }
        if (s1h.empty && (!ph.empty || !pa.empty)){ alert('Enter Leg 1 before adding penalty scores.'); break; }
      } else if (!s2h.empty || !s2a.empty){
        alert('This round is set to a single match. Change “Legs” before the first result if you need two legs.');
        break;
      }
      if (!s2h.empty && (s2h.empty !== s2a.empty)){ alert('Enter both Leg 2 scores.'); break; }
      if ((ph.empty !== pa.empty)){ alert('Enter both penalty scores, or leave both blank.'); break; }
      if (!ph.empty && !pa.empty && ph.value === pa.value){ alert('Penalty shootout scores cannot be level — one team must win.'); break; }
      if ((etH.empty !== etA.empty)){ alert('Enter both extra-time scores, or leave both blank.'); break; }
      m.homeId = home; m.awayId = away;
      m.kickoff = kickRaw ? localInputToIso(kickRaw) : '';
      m.legMode = mode;
      m.awayGoalsRule = rules.awayGoals;
      m.extraTime = rules.extraTime;
      m.homeScore = s1h.empty ? null : s1h.value;
      m.awayScore = s1a.empty ? null : s1a.value;
      if (mode === 'two'){
        m.leg2HomeScore = s2h.empty ? null : s2h.value;
        m.leg2AwayScore = s2a.empty ? null : s2a.value;
      } else {
        m.leg2HomeScore = null; m.leg2AwayScore = null;
      }
      m.etHome = rules.extraTime && !etH.empty ? etH.value : null;
      m.etAway = rules.extraTime && !etA.empty ? etA.value : null;
      m.penHome = !ph.empty ? ph.value : null;
      m.penAway = !pa.empty ? pa.value : null;
      m.penWinner = (!ph.empty && !pa.empty) ? (ph.value > pa.value ? 'home' : 'away') : null;
      m.leg1Saved = !s1h.empty;
      // A completed level tie needs a recorded shootout (or away-goals/extra-time separation).
      const completeNow = mode === 'two' ? (!s2h.empty && !s1h.empty) : !s1h.empty;
      if (completeNow){
        const a = tieAggregate(m);
        if (a.aggH === a.aggA){
          const awaySeparates = mode === 'two' && rules.awayGoals && a.awayH !== a.awayA;
          const etSeparates = a.usedEt && (m.etHome !== m.etAway);
          if (!awaySeparates && !etSeparates && ((m.penHome == null) || (m.penAway == null))){
            Object.keys(m).forEach(k => { delete m[k]; });
            Object.assign(m, originalTie);
            if (rules.extraTime && !a.usedEt){
              alert('The tie is level. Add extra-time goals (and penalties if still level), or turn extra time off and enter a penalty shootout.');
            } else {
              alert('The tie is level. Add a penalty shootout score so the winner can advance.');
            }
            break;
          }
        }
      }
      const cleared = autoAdvance(t);
      if (cleared){
        flash = '✅ Result saved. The winner changed, so ' + cleared + ' later-round result' + (cleared === 1 ? ' was' : 's were') + ' cleared. Please check the later rounds.';
      } else if (mode === 'two' && !m.leg2HomeScore && m.leg2HomeScore !== 0){
        flash = '✅ Leg 1 saved — Leg 2 is now open for this tie.';
      } else {
        flash = '✅ Knockout tie saved.';
      }
      const a2 = tieAggregate(m);
      logMsg = a2.complete
        ? 'Recorded knockout result: ' + teamName(t, m.homeId) + ' ' + a2.aggH + '-' + a2.aggA + ' ' + teamName(t, m.awayId)
        : 'Recorded a knockout Leg 1 result: ' + teamName(t, m.homeId) + ' vs ' + teamName(t, m.awayId);
      break;
    }
    case 'set-round-mode': {
      if (!t || !t.knockouts) break;
      const r = Number(elId);
      if (!Number.isInteger(r) || !t.knockouts.rounds[r]) break;
      if (roundHasResult(t, r)){ alert('The round format is locked after the first result. Reset that round’s results first if you need to change it.'); break; }
      const mode = el && el.value === 'single' ? 'single' : 'two';
      t.knockouts.config = t.knockouts.config || {};
      t.knockouts.config.roundModes = Array.isArray(t.knockouts.config.roundModes) ? t.knockouts.config.roundModes : defaultRoundModes(t.knockouts.rounds[0].length * 2);
      t.knockouts.config.roundModes[r] = mode;
      t.knockouts.rounds[r].forEach(m => { m.legMode = mode; });
      flash = '✅ ' + roundTitleFor(t.knockouts.rounds[r].length) + ' set to ' + (mode === 'two' ? 'two legs' : 'a single match') + '.';
      logMsg = 'Changed ' + roundTitleFor(t.knockouts.rounds[r].length) + ' to ' + (mode === 'two' ? 'two legs' : 'a single match');
      break;
    }
    case 'ko-rule': {
      if (!t || !t.knockouts) break;
      const key = elId === 'extraTime' ? 'extraTime' : 'awayGoals';
      t.knockouts.config = t.knockouts.config || {};
      t.knockouts.config.rules = Object.assign({}, KO_DEFAULT_RULES, t.knockouts.config.rules || {});
      t.knockouts.config.rules[key] = !!(el && el.checked);
      t.knockouts.rounds.forEach(rd => (rd || []).forEach(m => { m[key] = t.knockouts.config.rules[key]; }));
      const cleared = autoAdvance(t);
      flash = '✅ ' + (key === 'awayGoals' ? 'Away goals' : 'Extra time') + ' rule ' + (t.knockouts.config.rules[key] ? 'on' : 'off') + (cleared ? ' — ' + cleared + ' later result(s) cleared.' : '.');
      logMsg = 'Set ' + (key === 'awayGoals' ? 'away goals' : 'extra time') + ' rule ' + (t.knockouts.config.rules[key] ? 'on' : 'off');
      break;
    }
    case 'reset-bracket': {
      if (t && confirm('Reset the whole knockout bracket? All knockout results will be cleared; you can rebuild it from the current standings.')){
        t.knockouts = null;
        view.pickOverrides = {}; view.qgValues = {}; view.wildcards = 0;
        flash = '↺ Bracket reset — set it up again with the qualify counts.';
        logMsg = 'Reset the knockout bracket';
      }
      break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fc-mobile-league-backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': document.getElementById('importFile')?.click(); break;
    case 'import-file-change': {
      const file = el.files && el.files[0];
      if (!file) break;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = migrate(JSON.parse(reader.result));
          if (!data || !Array.isArray(data.tournaments)) throw new Error('bad');
          state = data;
          ensureSite();
          save('Imported a backup file');
          flash = '✅ Backup imported successfully.';
          render();
        } catch(err){ alert('That file is not a valid backup (expected JSON with a "tournaments" array).'); }
      };
      reader.readAsText(file);
      return;
    }
    case 'reset-all': {
      if (confirm('Erase EVERYTHING (all tournaments)? This cannot be undone.')){
        localStorage.removeItem(LS_KEY);
        state = { tournaments: [] };
        ensureSite();
        view = { type:'dashboard' };
        flash = '🗑️ All data erased.';
        logMsg = 'Erased all data';
      }
      break;
    }
  }
  save(logMsg || ACT_MSG[action] || '');
  render();
}

/* ================= GLOBAL EVENT DELEGATION ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  handle(el.dataset.action, el.dataset.id || null, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el && el.id === 'wizardTeams'){ if (groupWizardDraft) groupWizardDraft.raw = el.value || ''; return; }
  if (el && el.getAttribute){
    const roundMode = el.getAttribute('data-ko-round-mode');
    if (roundMode != null){ handle('set-round-mode', roundMode, el); return; }
    const koRule = el.getAttribute('data-ko-rule');
    if (koRule){ handle('ko-rule', koRule, el); return; }
    const seedId = el.getAttribute('data-wizard-seed');
    if (seedId && groupWizardDraft){
      const team = wizardTeamById(groupWizardDraft, seedId);
      if (team){ team.seed = !!el.checked; groupWizardError = ''; render(); }
      return;
    }
    const clubId = el.getAttribute('data-wizard-club');
    if (clubId && groupWizardDraft){
      const team = wizardTeamById(groupWizardDraft, clubId);
      if (team){ team.club = String(el.value || '').trim().slice(0, 30); groupWizardCheckConflicts(); render(); }
      return;
    }
    const tagId = el.getAttribute('data-wizard-tag');
    if (tagId && groupWizardDraft){
      const team = wizardTeamById(groupWizardDraft, tagId);
      if (team){ team.tag = String(el.value || '').trim().slice(0, 30); groupWizardCheckConflicts(); render(); }
      return;
    }
    const moveId = el.getAttribute('data-wizard-move');
    if (moveId){ groupWizardMove(moveId, Number(el.value)); return; }
  }
  if (el && el.id === 'fixtureTeamFilter'){ fixtureTeamFilter = el.value || ''; render(); return; }
  if (el && el.hasAttribute && el.hasAttribute('data-fantasy-round')){ fantasyRoundKey = el.value || ''; fantasyEditing = false; fantasyError = ''; render(); return; }
  if (el && el.id === 'importFile'){ handle('import-file-change', null, el); return; }
  if (el && el.id === 'newsCoverFile'){
    if (!newsDraft){ return; }
    captureNewsDraft();
    readImageFile(el.files && el.files[0], src => {
      if (!newsDraft) return;
      newsDraft.cover = src;
      render();
    }, msg => { newsError = msg; });
    return;
  }
  if (el && el.id === 'aboutLogoFile'){
    if (!aboutDraft){ return; }
    captureAboutDraft();
    readImageFile(el.files && el.files[0], src => {
      if (!aboutDraft) return;
      aboutDraft.logo = src;
      render();
    });
    return;
  }
  if (el && el.id === 'reportGalleryFile'){
    if (!reportDraft){ return; }
    captureReportDraft();
    readImageFile(el.files && el.files[0], src => {
      if (!reportDraft) return;
      reportDraft.gallery = reportDraft.gallery || [];
      if (reportDraft.gallery.length >= 12){
        reportError = 'Please keep the gallery to 12 screenshots or fewer.';
        render(); return;
      }
      reportDraft.gallery.push({ id: uid('im'), src: src, caption: '' });
      reportError = '';
      render();
    }, msg => { reportError = msg; });
    return;
  }
  if (el && el.id === 'playerPhotoFile'){
    if (!playerDraft){ return; }
    capturePlayerDraft();
    readImageFile(el.files && el.files[0], src => {
      if (!playerDraft) return;
      playerDraft.photo = src;
      playerError = '';
      render();
    }, msg => { playerError = msg; });
    return;
  }
  if (el && el.id === 'spotlightPhotoFile'){
    if (!spotlightDraft){ return; }
    captureSpotlightDraft();
    readImageFile(el.files && el.files[0], src => {
      if (!spotlightDraft) return;
      spotlightDraft.photo = src;
      spotlightError = '';
      render();
    }, msg => { spotlightError = msg; });
    return;
  }
  if (el && el.id && String(el.id).indexOf('ab-staff-file-') === 0){
    if (!aboutDraft){ return; }
    const staffId = String(el.id).slice('ab-staff-file-'.length);
    captureAboutDraft();
    readImageFile(el.files && el.files[0], src => {
      if (!aboutDraft) return;
      const p = aboutDraft.about.staff.find(x => x.id === staffId);
      if (p){ p.photo = src; render(); }
    });
    return;
  }
  if (el && el.hasAttribute && el.hasAttribute('data-qual-slot')){
    view.pickOverrides[el.dataset.qualSlot] = el.value || null;
    render(); return;
  }
  if (el && el.id === 'matchGroup'){ view.matchGroupId = el.value || null; render(); return; }
  if (el && el.hasAttribute && el.hasAttribute('data-qg')){
    view.qgValues[el.dataset.qg] = Math.max(0, parseInt(el.value, 10) || 0);
    render(); return;
  }
  if (el && el.id === 'wildcards'){
    view.wildcards = Math.max(0, parseInt(el.value, 10) || 0);
    render(); return;
  }
});
/* Manual draw: HTML5 drag-and-drop between group columns (touch users get
   the compact “move to” select on every team chip). */
document.addEventListener('dragstart', e => {
  const el = e.target && e.target.closest ? e.target.closest('[data-wizard-drag]') : null;
  if (!el) return;
  groupWizardDragId = el.getAttribute('data-wizard-drag') || '';
  if (e.dataTransfer){
    try { e.dataTransfer.setData('text/plain', groupWizardDragId); e.dataTransfer.effectAllowed = 'move'; } catch (err){ /* older browsers */ }
  }
});
document.addEventListener('dragover', e => {
  const drop = e.target && e.target.closest ? e.target.closest('[data-wizard-drop]') : null;
  if (!drop) return;
  e.preventDefault();
  if (e.dataTransfer) { try { e.dataTransfer.dropEffect = 'move'; } catch (err){ /* ignore */ } }
});
document.addEventListener('drop', e => {
  const drop = e.target && e.target.closest ? e.target.closest('[data-wizard-drop]') : null;
  if (!drop || !groupWizardDraft) return;
  e.preventDefault();
  let id = groupWizardDragId;
  if (!id && e.dataTransfer){ try { id = e.dataTransfer.getData('text/plain'); } catch (err){ /* ignore */ } }
  groupWizardDragId = '';
  if (id) groupWizardMove(id, Number(drop.getAttribute('data-wizard-drop')));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    const fm = e.target.closest && e.target.closest('form[data-form]');
    if (fm){
      const btn = fm.querySelector('[data-action]');
      if (btn){ e.preventDefault(); handle(btn.dataset.action, btn.dataset.id || null, btn); }
    }
  }
});

/* keep every page shareable: #home, #league, #fixtures, #news, #predict, #match/… */
function onHashChange(){
  const parsed = readHashRoute();
  if (!parsed){
    route = 'home'; routePage = null; routeParam = ''; routeTouched = true;
    render(); return;
  }
  const same = route === parsed.tab && routePage === (parsed.page || null) && routeParam === (parsed.param || '') && (!parsed.sub || parsed.sub === fanSub);
  if (same) return;
  applyRoute(parsed);
  routeTouched = true;
  try { localStorage.setItem(LS_TAB_KEY, route); } catch (e){ /* private mode */ }
  render();
}
if (typeof window !== 'undefined' && window && typeof window.addEventListener === 'function'){
  window.addEventListener('hashchange', onHashChange);
} else if (typeof location !== 'undefined' && location && typeof location.addEventListener === 'function'){
  location.addEventListener('hashchange', onHashChange);
}

/* Browser-only mode: if another tab changes/removes an account, re-check this tab. */
if (typeof window !== 'undefined' && window && typeof window.addEventListener === 'function'){
  window.addEventListener('storage', e => {
    if (IS_SERVER || !e || e.key !== ADMIN_STORE_KEY) return;
    adminAccounts = initAdminAccounts();
    if (adminPanelOpen) adminAccountsCache = adminAccounts.users.map(publicLocalUser);
    if (unlocked && serverMe){
      const restored = readLocalAdminSession();
      if (!restored){
        clearAdminSession();
        flash = 'Your admin account changed — you have been logged out.';
      } else {
        const current = adminAccounts.users.find(u => normalizeUsername(u.username) === restored.username);
        if (current) applyLocalSession(current);
        else clearAdminSession();
      }
    }
    render();
  });
}

/* ================= INIT ================= */
ensureSite();
if (migratedNow) save();
render();
if (IS_SERVER) initServer();
