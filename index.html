<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Mobile League Manager</title>
<style>
  :root{
    --bg:#070d1a; --bg2:#0b1526; --card:#0f1b30; --card2:#13233e;
    --line:rgba(255,255,255,.09); --txt:#e8eef7; --dim:#8ea3bf;
    --green:#34d399; --green2:#22c55e; --cyan:#38bdf8; --amber:#fbbf24;
    --red:#f87171; --gold:#fbbf24; --silver:#cbd5e1; --bronze:#d97706; --radius:14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(34,197,94,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(56,189,248,.12), transparent 60%),
      var(--bg);
    color:var(--txt); min-height:100vh;
  }
  button{ font-family:inherit; cursor:pointer; }
  input,select{
    font-family:inherit; color:var(--txt); background:#0d1930; border:1px solid var(--line);
    border-radius:9px; padding:9px 11px; font-size:14px; outline:none; min-width:0;
  }
  input:focus,select:focus{ border-color:var(--green); box-shadow:0 0 0 3px rgba(52,211,153,.15); }
  input[type=number]{ width:64px; text-align:center; }
  select option{ background:#0d1930; }
  ::placeholder{ color:#5b7190; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:rgba(11,21,38,.85); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:50; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .brand-icon{
    width:46px; height:46px; border-radius:12px; display:grid; place-items:center; font-size:24px;
    background:linear-gradient(135deg,var(--green2),#0ea5e9); box-shadow:0 4px 18px rgba(34,197,94,.35);
  }
  .brand h1{ font-size:19px; letter-spacing:.3px; }
  .brand p{ font-size:11.5px; color:var(--dim); }
  .top-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .btn{
    border:1px solid var(--line); background:linear-gradient(180deg,#152642,#0f1b30);
    color:var(--txt); padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:600; transition:.15s;
  }
  .btn:hover{ border-color:var(--green); transform:translateY(-1px); }
  .btn.primary{ background:linear-gradient(135deg,var(--green2),#10b981); border:none; color:#04140b; }
  .btn.primary:hover{ filter:brightness(1.1); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:#ffb4b4; }
  .btn.danger:hover{ border-color:var(--red); background:rgba(248,113,113,.08); }
  .btn.small{ padding:5px 10px; font-size:12px; border-radius:8px; }
  .admin-btn{ background:linear-gradient(135deg,#334155,#1e293b); border-color:#4b5d75; color:#ffd36b; }
  .admin-badge{
    background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.4); color:#ffd36b;
    padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:700; letter-spacing:.4px;
  }
  .pin-form{
    display:flex; gap:8px; align-items:center; background:rgba(251,191,36,.06);
    border:1px solid rgba(251,191,36,.35); padding:8px; border-radius:12px; flex-wrap:wrap;
  }
  .pin-form input{ width:130px; }

  .wrap{ max-width:1080px; margin:0 auto; padding:26px 18px 80px; }
  .page-head{ margin-bottom:14px; }
  .page-head h2{ font-size:24px; }
  .hint{ color:var(--dim); font-size:13px; margin-top:4px; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line); border-radius:var(--radius); padding:18px;
    display:flex; flex-direction:column; gap:10px; position:relative; transition:.15s;
  }
  .card:hover{ border-color:rgba(52,211,153,.5); transform:translateY(-2px); }
  .card h3{ font-size:17px; }
  .card .meta{ color:var(--dim); font-size:12.5px; display:flex; flex-direction:column; gap:3px; }
  .card .leader{ color:var(--green); font-weight:600; font-size:13px; }
  .card .actions{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .status-pill{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px;
    padding:4px 10px; border-radius:999px; text-transform:uppercase;
  }
  .st-setup{ background:#334155; color:#cbd5e1; }
  .st-group{ background:rgba(56,189,248,.14); color:var(--cyan); }
  .st-ko{ background:rgba(251,191,36,.14); color:var(--amber); }
  .st-champ{ background:rgba(34,197,94,.16); color:var(--green); }
  .new-card{ align-items:center; justify-content:center; min-height:180px; border-style:dashed; text-align:center; cursor:pointer; }
  .new-card:hover{ border-color:var(--green); }
  .new-card form{ display:flex; flex-direction:column; gap:10px; width:100%; }
  .new-card input{ width:100%; text-align:center; }
  .champ-tag{ font-size:13.5px; color:var(--gold); font-weight:700; }

  .back-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .back-row .tname{ font-size:21px; font-weight:700; flex:1; min-width:200px; }
  .tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto; }
  .tab-btn{
    background:transparent; border:none; color:var(--dim); padding:10px 18px;
    font-size:14px; font-weight:700; border-bottom:3px solid transparent; letter-spacing:.3px;
  }
  .tab-btn.active{ color:var(--txt); border-bottom-color:var(--green); }
  .tab-btn:hover{ color:var(--txt); }

  .panel{ display:flex; flex-direction:column; gap:18px; }
  .section-title{ font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .section-title small{ color:var(--dim); font-weight:400; }

  .form-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .form-row label{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--dim); }
  .form-row label input,.form-row label select{ width:auto; }
  .team-form .form-row label input{ width:180px; }
  .match-form .form-row label select{ min-width:150px; }

  table.table{ width:100%; border-collapse:collapse; font-size:14px; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); }
  .table th,.table td{ padding:10px 12px; text-align:center; white-space:nowrap; }
  .table thead th{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
    border-bottom:1px solid var(--line); background:rgba(255,255,255,.03);
  }
  .table tbody tr{ border-bottom:1px solid rgba(255,255,255,.045); transition:.12s; }
  .table tbody tr:hover{ background:rgba(255,255,255,.035); }
  .table td.tname{ text-align:left; font-weight:600; }
  .table td.tname .gd{ display:inline-block; font-size:10px; color:var(--dim); margin-left:6px; }
  .table .pos{ font-weight:800; width:44px; }
  .pos10{ background:rgba(251,191,36,.14) !important; color:var(--gold); }
  .pos11{ background:rgba(203,213,225,.10) !important; color:var(--silver); }
  .pos1b{ background:rgba(217,119,6,.12) !important; color:var(--bronze); }
  .qual-zone td{ background:rgba(52,211,153,.05); }
  .pts-cell{ font-weight:800; color:var(--green); }
  .q-badge{
    font-size:10px; font-weight:800; background:rgba(52,211,153,.18); color:var(--green);
    border:1px solid rgba(52,211,153,.4); padding:2px 6px; border-radius:6px; letter-spacing:.5px;
  }
  .chip{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.4px;
    padding:2px 8px; border-radius:999px; background:rgba(56,189,248,.12); color:var(--cyan);
    border:1px solid rgba(56,189,248,.35); text-transform:uppercase;
  }

  .group-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .group-pill{
    border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--dim);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; transition:.12s;
  }
  .group-pill:hover{ border-color:var(--cyan); color:var(--txt); }
  .group-pill.active{ background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(52,211,153,.18)); border-color:var(--cyan); color:var(--txt); }
  .group-pill .gcount{ color:var(--dim); font-size:11px; margin-left:5px; }
  .group-pill.add{ border-style:dashed; color:var(--green); }
  .group-pill.add:hover{ border-color:var(--green); }
  .group-pill.qual-badge{ border-color:rgba(251,191,36,.4); }

  .roster{ display:flex; flex-direction:column; gap:8px; }
  .roster-row{
    display:flex; align-items:center; gap:10px; padding:8px 12px; flex-wrap:wrap;
    background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:10px;
  }
  .roster-row .dot{ width:9px; height:9px; border-radius:50%; background:var(--green); }
  .roster-row .rname{ font-weight:600; flex:1; min-width:120px; }
  .roster-row .rnote{ color:var(--dim); font-size:12.5px; }
  .roster-row select{ font-size:12px; padding:6px 8px; }

  .group-manager{ display:flex; flex-direction:column; gap:12px; }
  .gm-card{
    border:1px solid var(--line); border-radius:var(--radius); padding:14px; background:var(--card);
    display:flex; flex-direction:column; gap:10px;
  }
  .gm-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .gm-head .gname{ font-weight:800; font-size:15px; min-width:90px; }
  .gm-head input{ flex:1; min-width:130px; max-width:220px; }
  .gm-head .teams-count{ color:var(--dim); font-size:12px; }

  .match-list{ display:flex; flex-direction:column; gap:8px; }
  .match-row{
    display:flex; align-items:center; gap:12px; padding:10px 14px; flex-wrap:wrap;
    background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:10px;
  }
  .match-row .score-line{ flex:1; display:flex; align-items:center; gap:10px; font-size:14.5px; min-width:220px; }
  .match-row .score-line .name{ font-weight:600; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .match-row .score-line .vs{ color:var(--dim); font-weight:700; }
  .match-row .score-line .goals{ font-size:17px; font-weight:800; color:var(--green); min-width:44px; text-align:center; }
  .edit-form{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; flex:1; }
  .filter-bar{ display:flex; gap:6px; flex-wrap:wrap; }

  .ko-grid{ display:flex; flex-direction:column; gap:22px; }
  .ko-round h3{ font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .ko-round h3 .rcount{ color:var(--dim); font-weight:400; font-size:12.5px; }
  .ko-matches{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
  .ko-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px;
    display:flex; flex-direction:column; gap:10px; position:relative;
  }
  .ko-card .mhead{ font-size:11px; color:var(--dim); letter-spacing:.6px; display:flex; justify-content:space-between; align-items:center; }
  .ko-card .pair{ display:flex; flex-direction:column; gap:8px; }
  .ko-card .team-line{ display:flex; align-items:center; gap:8px; }
  .ko-card .team-line .tname{ flex:1; font-weight:600; }
  .ko-card .team-line .tscore{ font-size:16px; font-weight:800; color:var(--green); min-width:26px; }
  .ko-card .team-line.winner .tname{ color:var(--gold); }
  .ko-card .team-line .trophy{ font-size:13px; }
  .ko-card .forms{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .ko-card select{ flex:1; min-width:110px; font-size:12.5px; padding:7px 8px; }
  .ko-card .adv{ font-size:11.5px; color:var(--dim); border-top:1px dashed var(--line); padding-top:8px; }
  .adv strong{ color:var(--amber); }
  .pen-line{ font-size:11.5px; color:var(--cyan); }
  .champ-banner{
    background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(34,197,94,.14));
    border:1px solid rgba(251,191,36,.45); border-radius:var(--radius);
    padding:22px 18px; text-align:center; font-size:19px; font-weight:800;
  }
  .champ-banner .trophy{ font-size:34px; display:block; margin-bottom:6px; }
  .champ-banner small{ display:block; font-size:12.5px; color:var(--dim); font-weight:400; margin-top:4px; }

  .qual-panel{ border:1px solid var(--line); border-radius:var(--radius); padding:16px; background:var(--card); display:flex; flex-direction:column; gap:14px; }
  .count-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .count-row label{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); }
  .count-row label input{ width:70px; }
  .total-line{ font-size:15px; font-weight:800; color:var(--green); }
  .total-line .note{ font-size:12px; color:var(--dim); font-weight:400; }
  .pair-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; }
  .pair-box{ border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,.02); }
  .pair-box .plabel{ font-size:10.5px; color:var(--dim); letter-spacing:.5px; font-weight:700; text-transform:uppercase; }
  .pair-box .prows{ display:flex; flex-direction:column; gap:6px; }
  .pair-box select{ width:100%; font-size:12.5px; padding:7px 8px; }
  .empty-box{ border:1px dashed var(--line); border-radius:var(--radius); padding:30px 20px; text-align:center; color:var(--dim); font-size:14px; }
  .flash{
    background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.4); color:#ffd987;
    padding:10px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;
  }
  .footer-note{ margin-top:40px; color:#5b7190; font-size:12px; text-align:center; line-height:1.6; }

  /* ---- winner + champion animations ---- */
  @keyframes pop-in{ from{ opacity:0; transform:scale(.88); } to{ opacity:1; transform:scale(1); } }
  @keyframes shine{
    0%{ background-position:0% 0; } 100%{ background-position:200% 0; }
  }
  @keyframes winner-pulse{
    0%{ box-shadow:0 0 0 0 rgba(251,191,36,.5); }
    70%{ box-shadow:0 0 0 12px rgba(251,191,36,0); }
    100%{ box-shadow:0 0 0 0 rgba(251,191,36,0); }
  }
  @keyframes trophy-in{
    0%{ transform:rotate(-40deg) scale(0); opacity:0; }
    60%{ transform:rotate(12deg) scale(1.3); }
    100%{ transform:rotate(0) scale(1); opacity:1; }
  }
  @keyframes stamp-in{
    0%{ transform:scale(0) rotate(-12deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(4deg); }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  @keyframes conf-fall{
    0%{ transform:translateY(-24px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(150px) rotate(340deg); opacity:0; }
  }
  @keyframes banner-in{
    0%{ opacity:0; transform:translateY(10px) scale(.97); }
    100%{ opacity:1; transform:none; }
  }
  .ko-card .team-line{ position:relative; border-radius:8px; }
  .ko-card .team-line.winner{
    background:linear-gradient(90deg, rgba(251,191,36,.05), rgba(251,191,36,.22), rgba(251,191,36,.05));
    background-size:200% 100%;
    animation:shine 2.4s linear infinite;
    padding:6px 8px;
  }
  .ko-card .team-line.winner::before{
    content:''; position:absolute; inset:0; border-radius:8px; pointer-events:none;
    animation:winner-pulse 2.2s ease-out infinite;
  }
  .ko-card .trophy{ display:inline-block; font-size:15px; animation:trophy-in .5s cubic-bezier(.34,1.56,.64,1) both; }
  .win-stamp{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:1px;
    color:#211503; background:linear-gradient(135deg,#fde68a,#fbbf24);
    border-radius:6px; padding:3px 9px; text-transform:uppercase;
    animation:stamp-in .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  .champ-banner{ position:relative; overflow:hidden; animation:banner-in .5s ease-out both; }
  .champ-banner .trophy{ display:inline-block; font-size:36px; animation:trophy-in .65s cubic-bezier(.34,1.56,.64,1) both; }
  .confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:var(--radius); }
  .confetti i{ position:absolute; top:-6px; width:7px; height:10px; border-radius:2px; animation:conf-fall 2.6s ease-in infinite; }
  .match-row .win-side{ color:var(--gold); font-weight:800; animation:pop-in .35s ease-out both; }
  .match-row .win-side::after{ content:' ⭐'; font-size:12px; }

  /* ---- overall rankings + advice ---- */
  .rank-list{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .rank-row{
    display:flex; gap:14px; align-items:center; padding:12px 14px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    animation:pop-in .3s ease-out both;
  }
  .rank-row .rank-badge{
    flex:0 0 40px; height:40px; border-radius:50%; display:grid; place-items:center;
    font-weight:800; font-size:15px; color:var(--txt);
    background:rgba(255,255,255,.05); border:1px solid var(--line);
  }
  .rank-row.gold .rank-badge{ background:linear-gradient(135deg,#fbbf24,#d97706); color:#1f1302; border:none; }
  .rank-row.silver .rank-badge{ background:linear-gradient(135deg,#e2e8f0,#94a3b8); color:#0f172a; border:none; }
  .rank-row.bronze .rank-badge{ background:linear-gradient(135deg,#f59e0b,#92400e); color:#fff; border:none; }
  .rank-row .r-wrap{ flex:1; min-width:170px; }
  .rank-row .r-name{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rank-row .r-name .hint{ margin:0; }
  .rank-row .r-stats{ font-size:12.5px; color:var(--dim); display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; }
  .rank-row .r-stats b{ color:var(--txt); }
  .rank-row .r-tips{ width:100%; list-style:none; display:flex; flex-direction:column; gap:5px; margin-top:4px; }
  .rank-row .r-tips li{
    font-size:13px; color:#cfe0f5; padding:7px 11px;
    background:rgba(56,189,248,.06); border-left:3px solid var(--cyan);
    border-radius:0 9px 9px 0;
  }
  .rank-row.gold .r-tips li{ border-left-color:var(--gold); background:rgba(251,191,36,.07); }
  .rank-row .r-tips li:nth-child(2){ animation:pop-in .35s ease-out .08s both; }
  .rank-row .r-tips li:nth-child(3){ animation:pop-in .35s ease-out .16s both; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
  @media (max-width:620px){
    .wrap{ padding:18px 12px 60px; }
    .brand p{ display:none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= CONSTANTS / STATE ================= */
const PIN = 'qwert';
const LS_KEY = 'fcm_league_manager_v1';
const VALID_N = [2, 4, 8, 16, 32];  // legal total qualifiers (power of two)
let migrated = false;               // set true by load() when it migrated legacy data
let state = load() || { tournaments: [] };
let migratedNow = migrated;
let unlocked = sessionStorage.getItem('fcm_admin_unlocked') === '1';
let pinOpen = false;
let view = { type: 'dashboard', groupId: null, matchGroupId: null, pickOverrides: {}, qgValues: {}, wildcards: 0 };
let tab = 'table';
let editingMatchId = null;
let flash = '';

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function todayStr(){ return new Date().toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }

/* legacy data (single table + fixed QF/SF/Final) => groups + dynamic rounds */
function migrate(data){
  if (!data || !Array.isArray(data.tournaments)) return null;
  data.tournaments.forEach(t => {
    if (!t.groups && Array.isArray(t.teams)){
      t.groups = [{ id: uid('g'), name: 'Group A', teams: t.teams.slice() }];
      (t.matches || []).forEach(m => m.groupId = t.groups[0].id);
      delete t.teams;
    }
    if (t.knockouts && !t.knockouts.rounds && Array.isArray(t.knockouts.qf)){
      t.knockouts = { config: t.knockouts.config || null,
                      rounds: [t.knockouts.qf, t.knockouts.sf, t.knockouts.final] };
    }
    t.groups = t.groups || [];
    t.matches = t.matches || [];
  });
  return data;
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const d = migrate(JSON.parse(raw));
    migrated = true;
    return d;
  }catch(e){ return null; }
}
function findTournament(id){ return state.tournaments.find(t => t.id === id); }
function groupsOf(t){ return t.groups || []; }
function findGroup(t, gid){ return groupsOf(t).find(g => g.id === gid) || null; }
function allTeams(t){ const out = []; groupsOf(t).forEach(g => g.teams.forEach(x => out.push(x))); return out; }
function teamById(t, id){ for (const g of groupsOf(t)){ const f = g.teams.find(x => x.id === id); if (f) return f; } return null; }
function groupOfTeam(t, id){ return groupsOf(t).find(g => g.teams.some(x => x.id === id)) || null; }
function teamName(t, id){ const x = teamById(t, id); return x ? x.name : '???'; }
function nextGroupLetter(t){
  const n = groupsOf(t).length;
  return n < 26 ? String.fromCharCode(65 + n) : String(n + 1);
}

/* ================= DATA HELPERS ================= */
function computeTable(t){
  const stats = {};
  allTeams(t).forEach(team => {
    stats[team.id] = { team, groupId: groupOfTeam(t, team.id) ? groupOfTeam(t, team.id).id : null,
                       p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 };
  });
  t.matches.forEach(m => {
    const h = stats[m.homeId], a = stats[m.awayId];
    if (!h || !a) return;
    h.p++; a.p++;
    h.gf += m.homeGoals; h.ga += m.awayGoals;
    a.gf += m.awayGoals; a.ga += m.homeGoals;
    if (m.homeGoals > m.awayGoals){ h.w++; h.pts += 3; a.l++; }
    else if (m.homeGoals < m.awayGoals){ a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  const list = Object.values(stats);
  list.forEach(s => s.gd = s.gf - s.ga);
  list.sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  list.forEach((s,i) => s.rank = i + 1);
  return list;
}
function computeGroupTable(t, gid){
  const g = findGroup(t, gid);
  if (!g) return [];
  const stats = {};
  g.teams.forEach(team => stats[team.id] = { team, groupId: gid, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 });
  t.matches.forEach(m => {
    if (m.groupId !== gid) return;
    const h = stats[m.homeId], a = stats[m.awayId];
    if (!h || !a) return;
    h.p++; a.p++;
    h.gf += m.homeGoals; h.ga += m.awayGoals;
    a.gf += m.awayGoals; a.ga += m.homeGoals;
    if (m.homeGoals > m.awayGoals){ h.w++; h.pts += 3; a.l++; }
    else if (m.homeGoals < m.awayGoals){ a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  const list = Object.values(stats);
  list.forEach(s => s.gd = s.gf - s.ga);
  list.sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  list.forEach((s,i) => s.rank = i + 1);
  return list;
}
function hasDuplicateMatch(t, homeId, awayId, ignoreId){
  return t.matches.some(m => m.id !== ignoreId && m.homeId === homeId && m.awayId === awayId);
}
function matchWinner(m){
  if (!m || !m.homeId || !m.awayId) return null;
  if (m.penWinner) return m.penWinner === 'home' ? m.homeId : m.awayId;
  if (m.homeScore > m.awayScore) return m.homeId;
  if (m.awayScore > m.homeScore) return m.awayId;
  return null;
}
function makeEmptyKoMatch(){ return { id: uid('km'), homeId:null, awayId:null, homeScore:null, awayScore:null, penWinner:null }; }
function makeRounds(n){
  const rounds = [];
  let size = n / 2;
  while (size >= 1){
    rounds.push(Array.from({ length: size }, () => makeEmptyKoMatch()));
    size = size / 2;
  }
  return rounds;
}
function roundTitleFor(size){
  if (size === 1) return 'Final';
  if (size === 2) return 'Semi-finals';
  if (size === 4) return 'Quarter-finals';
  if (size === 8) return 'Round of 16';
  if (size === 16) return 'Round of 32';
  if (size === 32) return 'Round of 64';
  return 'Round of ' + (size * 2);
}
/* classic bracket seed order (1v8, 4v5, 3v6, 2v7 for N=8) */
function seedOrder(n){
  if (n === 2) return [0, 1];
  const half = seedOrder(n / 2), res = [];
  half.forEach(x => { res.push(x); res.push(n - 1 - x); });
  return res;
}
function autoAdvance(t){
  const ko = t.knockouts;
  if (!ko || !ko.rounds || ko.rounds.length < 2) return;
  for (let r = 0; r < ko.rounds.length - 1; r++){
    const cur = ko.rounds[r], next = ko.rounds[r + 1];
    cur.forEach((m, i) => {
      const w = matchWinner(m);
      const dst = next[Math.floor(i / 2)];
      if (!dst) return;
      if (i % 2 === 0){ if (w && !dst.homeId) dst.homeId = w; }
      else { if (w && !dst.awayId) dst.awayId = w; }
    });
  }
}
function champion(t){
  const ko = t.knockouts;
  if (!ko || !ko.rounds || !ko.rounds.length) return null;
  return matchWinner(ko.rounds[ko.rounds.length - 1][0]);
}
function tournamentStatus(t){
  if (!allTeams(t).length) return { key:'setup', label:'Setup' };
  const ch = champion(t);
  if (ch) return { key:'champ', label:'Champion' };
  if (t.knockouts) return { key:'ko', label:'Knockouts' };
  return { key:'group', label:'Group Stage' };
}
/* ordered qualifiers: group winners first (per-group counts), then best-placed wildcards */
function autoPicks(t, counts, wildcards){
  const order = [];
  groupsOf(t).forEach(g => {
    const rows = computeGroupTable(t, g.id);
    const n = Math.min(counts[g.id] || 0, rows.length);
    for (let i = 0; i < n; i++) order.push(rows[i].team.id);
  });
  const picked = new Set(order);
  const glob = computeTable(t);
  let w = Math.min(wildcards || 0, Math.max(0, allTeams(t).length - order.length));
  glob.forEach(r => { if (w > 0 && !picked.has(r.team.id)){ order.push(r.team.id); picked.add(r.team.id); w--; } });
  return order;
}
function qualifyCountFor(t, gid){
  const ko = t.knockouts;
  if (ko && ko.config && ko.config.counts && ko.config.counts[gid] != null) return ko.config.counts[gid];
  return 2; // default suggestion
}

function knockoutSetupHTML(t){

function makeTitleChain(n){
  const titles = [];
  let size = n / 2;
  while (size >= 1){ titles.push(roundTitleFor(size)); size = size / 2; }
  return titles.join(' → ');
}
function teamSelectOptions(t){
  return computeTable(t).map(r => ({ id: r.team.id, name: r.team.name, g: groupOfTeam(t, r.team.id) }));
}

function rankMedal(i){ return i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1); }
function rankClass(i){ return i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : ''; }
/* personalised tips for the next tournament, based on this team's stats */
function adviceFor(t, row){
  const r1 = n => Math.round(n * 10) / 10;
  const g = groupOfTeam(t, row.team.id);
  const gsize = g ? g.teams.length : 0;
  const maxP = Math.max(0, gsize - 1);
  const tips = [];
  if (row.p === 0){
    tips.push('Did not play a match this tournament — sign up early and get on the pitch from day one.');
  } else {
    const gpg = row.gf / row.p, gapg = row.ga / row.p;
    if (gpg < 0.8) tips.push('Attack needs more bite — only ' + r1(gpg) + ' goal(s) per game. Add finishing drills to your training.');
    else if (gpg >= 2.2) tips.push('You have a deadly attack (' + r1(gpg) + ' goals/game) — keep the front line together.');
    if (gapg > 1.6) tips.push('Your defence leaks ' + r1(gapg) + ' goal(s) per game — tighten the back line and trust your keeper.');
    else if (gapg <= 0.4 && row.p >= 2) tips.push('Rock-solid defence (' + r1(gapg) + ' conceded/game) — keep that back line intact next tournament.');
    if (row.d > 0 && row.d / row.p > 0.4 && row.p >= 3) tips.push('Too many draws — fine margins cost points. Practise killing games off late.');
    if (row.l / row.p > 0.5) tips.push('You lose more than you win — rebuild your tactics around your strongest players.');
    if (maxP > 0 && row.p < maxP) tips.push(row.p + ' of ' + maxP + ' group match(es) played — the games still ahead can change everything.');
    if (row.pts / (row.p * 3) >= 0.7 && row.p >= 2) tips.push('Elite form — ' + Math.round(row.pts / (row.p * 3) * 100) + '% of possible points. Carry the confidence into the next draw.');
    if (row.pts === 0) tips.push('Pointless this time — a clean slate; rebuild and bounce back stronger.');
  }
  if (maxP > 0){
    const gr = computeGroupTable(t, g.id).findIndex(r => r.team.id === row.team.id) + 1;
    if (gr === 1) tips.push('Group winner — bookmaker favourite for the next title.');
    else if (gr <= Math.ceil(gsize / 2)) tips.push('Finished top-' + gr + ' of ' + g.name + ' — a genuine contender next time.');
    else tips.push('Bottom-half finish (' + gr + ' of ' + gsize + ') — rethink your approach before the next draw.');
  }
  if (champion(t) === row.team.id) tips.unshift('Defending champion! Everyone will be gunning for you — evolve your squad or get dethroned.');
  if (!tips.length) tips.push('Keep playing and stay consistent — every match is a lesson for the next tournament.');
  return tips.slice(0, 3);
}

function render(){
  const app = document.getElementById('app');
  if (view.type === 'dashboard'){
    app.innerHTML = headerHTML() + dashboardHTML();
  } else {
    const t = findTournament(view.id);
    if (!t){ view = { type:'dashboard' }; return render(); }
    app.innerHTML = headerHTML() + tournamentHTML(t);
  }
}
/* ================= ACTIONS ================= */
function readCounts(t){
  const counts = {};
  groupsOf(t).forEach(g => {
    const v = view.qgValues && view.qgValues[g.id] != null ? view.qgValues[g.id] : qualifyCountFor(t, g.id);
    counts[g.id] = Math.max(0, Math.min(v, g.teams.length));
  });
  return counts;
}
function openTournamentState(t){
  const first = groupsOf(t).length ? groupsOf(t)[0].id : null;
  view = { type:'tournament', id: t.id, groupId: first, matchGroupId: first,
           matchFilter: null, pickOverrides: {}, qgValues: {}, wildcards: 0 };
  tab = 'table'; editingMatchId = null; pinOpen = false;
}
function handle(action, elId, el){
  const t = view.type === 'tournament' ? findTournament(view.id) : null;
  flash = '';
  switch(action){
    case 'go-home': view = { type:'dashboard' }; tab = 'table'; editingMatchId = null; break;
    case 'toggle-pin': pinOpen = !pinOpen; break;
    case 'set-pin': {
      const v = document.getElementById('pinInput');
      if (v && v.value.trim().toLowerCase() === PIN){
        unlocked = true; pinOpen = false;
        sessionStorage.setItem('fcm_admin_unlocked','1');
        flash = '✅ Admin mode unlocked — you can now edit everything.';
      } else {
        alert('Incorrect PIN. It was given to the tournament organizer only.');
      }
      break;
    }
    case 'lock':
      unlocked = false; pinOpen = false;
      sessionStorage.removeItem('fcm_admin_unlocked');
      editingMatchId = null;
      break;
    case 'create-tournament': {
      const v = document.getElementById('newTournamentName');
      const name = v ? v.value.trim() : '';
      if (!name){ alert('Give the tournament a name.'); break; }
      state.tournaments.push({
        id: uid('t'), name, createdAt: Date.now(),
        groups: [{ id: uid('g'), name: 'Group A', teams: [] }],
        matches: [], knockouts: null
      });
      save(); flash = '🏟️ Tournament created! Add teams to Group A, then add more groups.';
      break;
    }
    case 'open-tournament': {
      const tt = findTournament(elId); if (!tt) break;
      openTournamentState(tt);
      break;
    }
    case 'rename-tournament': {
      const tt = findTournament(elId); if (!tt) break;
      const name = prompt('New tournament name:', tt.name);
      if (name && name.trim()){ tt.name = name.trim(); save(); }
      break;
    }
    case 'delete-tournament': {
      const tt = findTournament(elId); if (!tt) break;
      if (confirm(`Delete "${tt.name}" and ALL its groups, teams, results and knockouts? This cannot be undone.`)){
        state.tournaments = state.tournaments.filter(x => x.id !== elId);
        save();
      }
      break;
    }
    case 'save-tournament-name': {
      const v = document.getElementById('tournNameInput');
      if (t && v && v.value.trim()){ t.name = v.value.trim(); save(); flash = '✅ Tournament renamed.'; }
      break;
    }
    case 'tab': tab = el.dataset.val; editingMatchId = null;
      if (tab === 'matches' && t && (!view.matchGroupId || !findGroup(t, view.matchGroupId))){
        view.matchGroupId = groupsOf(t).length ? groupsOf(t)[0].id : null;
      }
      break;
    case 'select-group': view.groupId = elId; break;
    case 'add-group': {
      if (!t) break;
      const g = { id: uid('g'), name: 'Group ' + nextGroupLetter(t), teams: [] };
      t.groups.push(g); view.groupId = g.id;
      save(); flash = '◧ ' + g.name + ' added.';
      break;
    }
    case 'rename-group': {
      const g = findGroup(t, elId);
      const v = document.getElementById('gname-' + elId);
      if (g && v && v.value.trim()){ g.name = v.value.trim(); save(); flash = '✅ Group renamed.'; }
      break;
    }
    case 'delete-group': {
      const g = findGroup(t, elId); if (!g) break;
      if (confirm(`Delete ${g.name} and ALL its teams + results? Related knockout picks are cleared too.`)){
        const teamIds = new Set(g.teams.map(x => x.id));
        t.matches = t.matches.filter(m => !(m.groupId === g.id || teamIds.has(m.homeId) || teamIds.has(m.awayId)));
        t.groups = t.groups.filter(x => x.id !== g.id);
        if (t.knockouts){
          const ko = t.knockouts;
          ko.rounds.forEach(rd => rd.forEach(m => {
            if (teamIds.has(m.homeId) || (m.homeId && teamIds.has(m.homeId))) m.homeId = null;
            if (teamIds.has(m.awayId) || (m.awayId && teamIds.has(m.awayId))) m.awayId = null;
          }));
          if (ko.config && ko.config.counts) delete ko.config.counts[g.id];
          autoAdvance(t);
          if (!groupsOf(t).length || allTeams(t).length === 0){ t.knockouts = null; }
        }
        if (view.groupId === g.id) view.groupId = groupsOf(t).length ? groupsOf(t)[0].id : null;
        save(); flash = '🗑️ ' + g.name + ' deleted.';
      }
      break;
    }
    case 'add-team': {
      const g = findGroup(t, view.groupId); if (!g) break;
      const nv = document.getElementById('newTeamName');
      const av = document.getElementById('newTeamNote');
      const name = nv ? nv.value.trim() : '';
      if (!name){ alert('Enter a team / player name.'); break; }
      g.teams.push({ id: uid('tm'), name, note: av ? av.value.trim() : '' });
      save(); flash = '👥 Team added to ' + g.name + '.';
      break;
    }
    case 'delete-team': {
      const team = teamById(t, elId); if (!team) break;
      const g = groupOfTeam(t, elId);
      if (confirm(`Remove "${team.name}"? Their results will also be removed.`)){
        g.teams = g.teams.filter(x => x.id !== elId);
        t.matches = t.matches.filter(m => m.homeId !== elId && m.awayId !== elId);
        if (t.knockouts){
          t.knockouts.rounds.forEach(rd => rd.forEach(m => {
            if (m.homeId === elId) m.homeId = null;
            if (m.awayId === elId) m.awayId = null;
          }));
          autoAdvance(t);
        }
        save(); flash = '🗑️ Team removed.';
      }
      break;
    }
    case 'move-team': {
      const sel = document.querySelector('[data-team-group="' + elId + '"]');
      if (!sel || !sel.value) break;
      const src = groupOfTeam(t, elId);
      const dst = findGroup(t, sel.value);
      const team = teamById(t, elId);
      if (!src || !dst || !team || src.id === dst.id) break;
      src.teams = src.teams.filter(x => x.id !== elId);
      dst.teams.push(team);
      t.matches.forEach(m => { if (m.homeId === elId || m.awayId === elId) m.groupId = dst.id; });
      save(); flash = '↔️ ' + team.name + ' moved to ' + dst.name + '.';
      break;
    }
    case 'filter-matches': view.matchFilter = elId || null; break;
    case 'add-match': {
      const g = findGroup(t, view.matchGroupId); if (!g) break;
      const home = document.getElementById('matchHome')?.value;
      const away = document.getElementById('matchAway')?.value;
      const hs = parseInt(document.getElementById('matchHomeGoals')?.value ?? '', 10);
      const as = parseInt(document.getElementById('matchAwayGoals')?.value ?? '', 10);
      if (!home || !away || !g.teams.some(x => x.id === home) || !g.teams.some(x => x.id === away)){ alert('Select two teams from ' + g.name + '.'); break; }
      if (home === away){ alert('A team cannot play itself.'); break; }
      if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0){ alert('Enter valid goal numbers.'); break; }
      if (hasDuplicateMatch(t, home, away, null)){ alert('That exact fixture already exists. Use Edit to change its score.'); break; }
      t.matches.push({ id: uid('m'), groupId: g.id, homeId: home, awayId: away, homeGoals: hs, awayGoals: as });
      save(); flash = '⚽ Result recorded — ' + g.name + ' table updated.';
      break;
    }
    case 'edit-match': editingMatchId = elId; break;
    case 'cancel-match-edit': editingMatchId = null; break;
    case 'save-match': {
      const m = t.matches.find(x => x.id === elId); if (!m) break;
      const home = document.getElementById('emHome')?.value;
      const away = document.getElementById('emAway')?.value;
      const hs = parseInt(document.getElementById('emHS')?.value ?? '', 10);
      const as = parseInt(document.getElementById('emAS')?.value ?? '', 10);
      if (!home || !away){ alert('Both teams must be selected.'); break; }
      if (home === away){ alert('A team cannot play itself.'); break; }
      if (isNaN(hs) || isNaN(as)){ alert('Enter valid goal numbers.'); break; }
      if (hasDuplicateMatch(t, home, away, m.id)){ alert('That exact fixture already exists elsewhere.'); break; }
      const ng = groupOfTeam(t, home); if (ng) m.groupId = ng.id;
      m.homeId = home; m.awayId = away; m.homeGoals = hs; m.awayGoals = as;
      editingMatchId = null; save(); flash = '✅ Match updated.';
      break;
    }
    case 'delete-match': {
      if (confirm('Delete this match result?')){
        t.matches = t.matches.filter(x => x.id !== elId);
        editingMatchId = null; save(); flash = '🗑️ Match deleted.';
      }
      break;
    }
    case 'create-bracket': {
      if (!t || allTeams(t).length < 2){ alert('Add teams first.'); break; }
      const counts = readCounts(t);
      const wildcards = Math.max(0, view.wildcards || 0);
      const total = groupsOf(t).reduce((s, g) => s + counts[g.id], 0) + wildcards;
      if (!VALID_N.includes(total) || total > allTeams(t).length){
        alert('The total number of qualifiers must be one of 2, 4, 8, 16 or 32 and can not exceed the number of teams.');
        break;
      }
      const ordered = autoPicks(t, counts, wildcards);
      const seed = seedOrder(total);
      const picks = seed.map((k, i) => {
        const ovr = view.pickOverrides && view.pickOverrides[i];
        return (ovr && teamById(t, ovr)) ? ovr : (ordered[k] || '');
      });
      if (picks.some(p => !p)){ alert('Every qualifier slot needs a team — fill the empty selects first.'); break; }
      if (new Set(picks).size !== total){ alert('Each team can only appear once in the bracket.'); break; }
      const rounds = makeRounds(total);
      for (let i = 0; i < total / 2; i++){ rounds[0][i].homeId = picks[i*2]; rounds[0][i].awayId = picks[i*2+1]; }
      t.knockouts = { config: { counts, wildcards }, rounds };
      autoAdvance(t);
      view.pickOverrides = {};
      save(); flash = '📋 Knockout bracket created (' + total + ' teams) — record the results!';
      break;
    }
    case 'save-ko-match': {
      if (!t || !t.knockouts) break;
      const m = [].concat.apply([], t.knockouts.rounds).find(x => x.id === elId);
      if (!m) break;
      const home = (document.querySelector('[data-ko-home="' + elId + '"]')?.value) || '';
      const away = (document.querySelector('[data-ko-away="' + elId + '"]')?.value) || '';
      const hsRaw = document.querySelector('[data-ko-hs="' + elId + '"]')?.value;
      const asRaw = document.querySelector('[data-ko-as="' + elId + '"]')?.value;
      const pen = (document.querySelector('[data-ko-pen="' + elId + '"]')?.value) || '';
      if (home && away && home === away){ alert('A team cannot play itself.'); break; }
      m.homeId = home || null; m.awayId = away || null;
      m.homeScore = hsRaw === '' ? null : Math.max(0, parseInt(hsRaw, 10) || 0);
      m.awayScore = asRaw === '' ? null : Math.max(0, parseInt(asRaw, 10) || 0);
      m.penWinner = pen || null;
      autoAdvance(t);
      save(); flash = '🏆 Knockout match saved.';
      break;
    }
    case 'reset-bracket': {
      if (t && confirm('Reset the whole knockout bracket? All knockout results will be cleared; you can rebuild it from the current standings.')){
        t.knockouts = null;
        view.pickOverrides = {}; view.qgValues = {}; view.wildcards = 0;
        save(); flash = '↺ Bracket reset — set it up again with the qualify counts.';
      }
      break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fc-mobile-league-backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      break;
    }
    case 'import': document.getElementById('importFile')?.click(); break;
    case 'import-file-change': {
      const file = el.files && el.files[0];
      if (!file) break;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = migrate(JSON.parse(reader.result));
          if (!data || !Array.isArray(data.tournaments)) throw new Error('bad');
          state = data;
          save();
          flash = '✅ Backup imported successfully.';
          render();
        } catch(err){ alert('That file is not a valid backup (expected JSON with a "tournaments" array).'); }
      };
      reader.readAsText(file);
      return;
    }
    case 'reset-all': {
      if (confirm('Erase EVERYTHING (all tournaments)? This cannot be undone.')){
        localStorage.removeItem(LS_KEY);
        state = { tournaments: [] };
        view = { type:'dashboard' };
        flash = '🗑️ All data erased.';
      }
      break;
    }
  }
  save();
  render();
}

/* ================= GLOBAL EVENT DELEGATION ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  handle(el.dataset.action, el.dataset.id || null, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el && el.id === 'importFile'){ handle('import-file-change', null, el); return; }
  if (el && el.hasAttribute && el.hasAttribute('data-qual-slot')){
    view.pickOverrides[el.dataset.qualSlot] = el.value || null;
    render(); return;
  }
  if (el && el.id === 'matchGroup'){ view.matchGroupId = el.value || null; render(); return; }
  if (el && el.hasAttribute && el.hasAttribute('data-qg')){
    view.qgValues[el.dataset.qg] = Math.max(0, parseInt(el.value, 10) || 0);
    render(); return;
  }
  if (el && el.id === 'wildcards'){
    view.wildcards = Math.max(0, parseInt(el.value, 10) || 0);
    render(); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    const fm = e.target.closest && e.target.closest('form[data-form]');
    if (fm){
      const btn = fm.querySelector('[data-action]');
      if (btn){ e.preventDefault(); handle(btn.dataset.action, btn.dataset.id || null, btn); }
    }
  }
});

/* ================= INIT ================= */
if (migratedNow) save();
render();
</script>
</body>
</html>
