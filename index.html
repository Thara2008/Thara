  if (!ANNOUNCE_STYLES[s.announcement.style]) s.announcement.style = 'info';

  s.announcement.text = s.announcement.text.slice(0, 280);

  if (!s.about || typeof s.about !== 'object' || Array.isArray(s.about)) s.about = defaultSite().about;
  const a = s.about;
  ['story', 'mission', 'format'].forEach(k => { if (typeof a[k] !== 'string') a[k] = ABOUT_TEXT[k]; });
  if (!Array.isArray(a.staff)) a.staff = [];
  if (!Array.isArray(a.links)) a.links = [];
  if (!Array.isArray(a.sponsors)) a.sponsors = [];
  a.staff.forEach(p => {
    if (!p || typeof p !== 'object') return;
    if (typeof p.id !== 'string' || !p.id) p.id = uid('st');
    if (typeof p.name !== 'string') p.name = '';
    if (typeof p.role !== 'string') p.role = '';
    if (typeof p.photo !== 'string') p.photo = '';
  });
  a.links.forEach(l => {
    if (!l || typeof l !== 'object') return;
    if (typeof l.id !== 'string' || !l.id) l.id = uid('lk');
    if (typeof l.label !== 'string') l.label = '';
    if (typeof l.platform !== 'string' || !PLATFORMS[l.platform]) l.platform = 'website';

    if (!p || typeof p !== 'object') return;
    if (typeof p.id !== 'string' || !p.id) p.id = uid('sp');

  // ---- Honours ----

  // ---- Match reports ----
  s.reports = plainObj(s.reports);

function allowedTab(t){ return SITE_TABS.indexOf(String(t || '').toLowerCase()) !== -1; }
function parseHashRoute(raw){
  let h = String(raw == null ? '' : raw).replace(/^#\/?/, '').trim();
  if (!h) return null;
  const parts = h.split('/');
  let head = '';
  try { head = decodeURIComponent(parts[0] || '').toLowerCase(); } catch (e){ head = (parts[0] || '').toLowerCase(); }
  let param = '';
  if (parts.length > 1){
    try { param = decodeURIComponent(parts.slice(1).join('/')); } catch (e){ param = parts.slice(1).join('/'); }
  }
  if (head === 'match') return { tab: 'fixtures', page: 'match', param, sub: null };
  if (head === 'player') return { tab: 'players', page: 'player', param, sub: null };
  if (head === 'post') return { tab: 'news', page: 'post', param, sub: null };
  if (head === 'news' && param) return { tab: 'news', page: 'post', param, sub: null };
  if (FAN_SUBS.indexOf(head) !== -1) return { tab: 'fans', page: null, param: '', sub: head };
  if (allowedTab(head)) return { tab: head, page: null, param: '', sub: head === 'fans' ? 'predict' : null };
  return null;
}
function readHashRoute(){
  try {
    if (typeof location === 'undefined' || !location || typeof location.hash !== 'string') return null;
    return parseHashRoute(location.hash);
  } catch (e){ return null; }
}
function readHashTab(){ const r = readHashRoute(); return r ? r.tab : null; }
function storedTab(){
  try {
    const v = localStorage.getItem(LS_TAB_KEY);
    return allowedTab(v) ? String(v).toLowerCase() : null;
  } catch (e){ return null; }
}
let initialRoute = readHashRoute();
let route = initialRoute ? initialRoute.tab : (storedTab() || 'home');
let routePage = initialRoute ? initialRoute.page : null;   // 'match' | 'player' | 'post' | null
let routeParam = initialRoute ? (initialRoute.param || '') : '';
let fanSub = (initialRoute && initialRoute.sub) || 'predict';
let routeTouched = false;          // true after an explicit tab click (keeps tests/headless renders on the legacy view)
function currentRoute(){
  // Headless callers (test/render harnesses) set `view` directly and never touch the nav:
  // follow them into the League tab so the tournament page still renders.
  if (!routeTouched && view && view.type === 'tournament') return 'league';
  return allowedTab(route) ? route : 'home';
}
function applyRoute(parsed){
  if (!parsed) return;
  route = parsed.tab;
  routePage = parsed.page || null;
  routeParam = parsed.param || '';
  if (parsed.sub && FAN_SUBS.indexOf(parsed.sub) !== -1) fanSub = parsed.sub;
  else if (parsed.tab === 'fans' && FAN_SUBS.indexOf(fanSub) === -1) fanSub = 'predict';
}
function hashForTab(tabId){ return tabId === 'fans' ? 'predict' : tabId; }
function rememberRoute(tabId, hash){
  try { localStorage.setItem(LS_TAB_KEY, tabId); } catch (e){ /* private mode */ }
  try {
    const want = '#' + (hash || hashForTab(tabId));
    if (typeof location !== 'undefined' && location && typeof location.hash === 'string' && location.hash !== want){
      location.hash = want;
    }
  } catch (e){ /* no history in this environment */ }
}
function navigate(tabId, skipRender){

function teamById(t, id){ for (const g of groupsOf(t)){ const f = g.teams.find(x => x.id === id); if (f) return f; } return null; }
function groupOfTeam(t, id){ return groupsOf(t).find(g => g.teams.some(x => x.id === id)) || null; }
function teamName(t, id){ const x = teamById(t, id); return x ? x.name : '???'; }
function nextGroupLetter(t){
  const n = groupsOf(t).length;
  return n < 26 ? String.fromCharCode(65 + n) : String(n + 1);
}

/* ================= DATA HELPERS ================= */
function computeTable(t){
  const stats = {};
  allTeams(t).forEach(team => {
    stats[team.id] = { team, groupId: groupOfTeam(t, team.id) ? groupOfTeam(t, team.id).id : null,
                       p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 };
  });
  t.matches.forEach(m => {
    if (m.homeGoals == null || m.awayGoals == null) return; // scheduled group fixture
    const h = stats[m.homeId], a = stats[m.awayId];
    if (!h || !a) return;
    h.p++; a.p++;
    h.gf += m.homeGoals; h.ga += m.awayGoals;
    a.gf += m.awayGoals; a.ga += m.homeGoals;
    if (m.homeGoals > m.awayGoals){ h.w++; h.pts += 3; a.l++; }
    else if (m.homeGoals < m.awayGoals){ a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  const list = Object.values(stats);
  list.forEach(s => s.gd = s.gf - s.ga);
  list.sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  list.forEach((s,i) => s.rank = i + 1);
  return list;
}
function computeGroupTable(t, gid){
  const g = findGroup(t, gid);
  if (!g) return [];
  const stats = {};
  g.teams.forEach(team => stats[team.id] = { team, groupId: gid, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0 });
  t.matches.forEach(m => {
    if (m.groupId !== gid) return;
    if (m.homeGoals == null || m.awayGoals == null) return; // scheduled group fixture
    const h = stats[m.homeId], a = stats[m.awayId];
    if (!h || !a) return;
    h.p++; a.p++;
    h.gf += m.homeGoals; h.ga += m.awayGoals;
    a.gf += m.awayGoals; a.ga += m.homeGoals;
    if (m.homeGoals > m.awayGoals){ h.w++; h.pts += 3; a.l++; }
    else if (m.homeGoals < m.awayGoals){ a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  const list = Object.values(stats);
  list.forEach(s => s.gd = s.gf - s.ga);
  list.sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  list.forEach((s,i) => s.rank = i + 1);
  return list;
}
function hasDuplicateMatch(t, homeId, awayId, ignoreId){
  return t.matches.some(m => m.id !== ignoreId && m.homeId === homeId && m.awayId === awayId);
}
function koScore(v){
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isInteger(n) && n >= 0 && n <= 99 ? n : null;
}
/* Group fixtures are always single-leg — even when a double round-robin
   creates a home and an away meeting. Two legs belong to knockout ties only. */
function stripGroupLegs(m){
  if (!m || typeof m !== 'object') return m;
  delete m.legMode;
  delete m.leg2HomeScore;
  delete m.leg2AwayScore;
  delete m.leg1Saved;
  delete m.kickoff2;
  return m;
}
function isTwoLeg(m){
  if (m && m.groupId) return false; // defensive guard for imported/legacy data
  return !!(m && (m.legMode === 'two' || m.leg2HomeScore != null || m.leg2AwayScore != null));
}
function koRuleFor(m, key){
  if (m && typeof m[key] === 'boolean') return m[key];
  return !!KO_DEFAULT_RULES[key];
}
function tieHasResult(m){
  return !!(m && (m.homeScore != null || m.awayScore != null || m.leg2HomeScore != null ||
    m.leg2AwayScore != null || m.etHome != null || m.etAway != null ||
    m.penHome != null || m.penAway != null || m.penWinner));
}
function clearTieResult(m){
  if (!m) return;
  m.homeScore = null; m.awayScore = null;
  m.leg2HomeScore = null; m.leg2AwayScore = null;
  m.etHome = null; m.etAway = null;
  m.penHome = null; m.penAway = null; m.penWinner = null;
  m.leg1Saved = false;
}
function koPenWinner(m){
  const ph = koScore(m && m.penHome), pa = koScore(m && m.penAway);
  if (ph != null && pa != null && ph !== pa) return ph > pa ? 'home' : 'away';
  if (m && (m.penWinner === 'home' || m.penWinner === 'away')) return m.penWinner;
  return null;
}
/* Aggregate + tie-break calculation. Works for legacy single-leg matches too. */
function tieAggregate(m){
  const two = isTwoLeg(m);
  const l1h = koScore(m && m.homeScore), l1a = koScore(m && m.awayScore);
  const l2h = koScore(m && m.leg2HomeScore), l2a = koScore(m && m.leg2AwayScore);
  const etH = koScore(m && m.etHome), etA = koScore(m && m.etAway);
  const leg1 = l1h != null && l1a != null;
  const leg2 = l2h != null && l2a != null;
  const usedEt = etH != null || etA != null;
  let aggH = null, aggA = null, awayH = 0, awayA = 0;
  if (two){
    if (leg1){ aggH = l1h; aggA = l1a; awayA = l1a; }
    if (leg1 && leg2){ aggH += l2a; aggA += l2h; awayH = l2a; }
    if (leg1 && usedEt){ aggH += (etA || 0); aggA += (etH || 0); awayH += (etA || 0); }
  } else if (leg1){
    aggH = l1h + (etH || 0);
    aggA = l1a + (etA || 0);
  }
  // Old brackets stored a single score pair and no leg1Saved flag. Keep those
  // readable/advanceable while new two-leg ties wait for Leg 2.
  const complete = two ? (leg2 || (leg1 && m.leg1Saved !== true)) : leg1;
  let winnerId = null, winnerSide = null, decidedBy = null;
  if (complete && aggH != null && aggA != null){
    if (aggH > aggA){ winnerSide = 'home'; decidedBy = usedEt ? 'extra-time' : 'aggregate'; }
    else if (aggA > aggH){ winnerSide = 'away'; decidedBy = usedEt ? 'extra-time' : 'aggregate'; }
    else if (two && koRuleFor(m, 'awayGoals') && awayH !== awayA){
      winnerSide = awayH > awayA ? 'home' : 'away'; decidedBy = 'away-goals';
    }
    if (!winnerSide){
      const p = koPenWinner(m);
      if (p){ winnerSide = p; decidedBy = 'penalties'; }
    }
    if (winnerSide && m && (m.homeId || m.awayId)) winnerId = winnerSide === 'home' ? (m.homeId || null) : (m.awayId || null);
  }
  const ph = koScore(m && m.penHome), pa = koScore(m && m.penAway);
  return {
    two, leg1, leg2, leg1Done: leg1, leg2Done: leg2, complete,
    l1h, l1a, l2h, l2a, etH, etA, usedEt,
    aggH, aggA, awayH, awayA,
    penH: ph, penA: pa, penWinner: koPenWinner(m),
    winnerId, winnerSide, decidedBy
  };
}
function matchWinner(m){
  if (!m || !m.homeId || !m.awayId) return null;
  return tieAggregate(m).winnerId;
}
function makeEmptyKoMatch(){
  return { id: uid('km'), homeId:null, awayId:null, homeScore:null, awayScore:null,
           leg2HomeScore:null, leg2AwayScore:null, etHome:null, etAway:null,
           penHome:null, penAway:null, penWinner:null, legMode:null, leg1Saved:false,
           kickoff:'', kickoff2:'' };
}
function makeRounds(n){
  const rounds = [];
  let size = n / 2;
  while (size >= 1){
    rounds.push(Array.from({ length: size }, () => makeEmptyKoMatch()));
    size = size / 2;
  }
  return rounds;
}
function roundTitleFor(size){
  if (size === 1) return 'Final';
  if (size === 2) return 'Semi-finals';
  if (size === 4) return 'Quarter-finals';
  if (size === 8) return 'Round of 16';
  if (size === 16) return 'Round of 32';
  if (size === 32) return 'Round of 64';
  return 'Round of ' + (size * 2);
}
/* classic bracket seed order (1v8, 4v5, 3v6, 2v7 for N=8) */
function seedOrder(n){
  if (n === 2) return [0, 1];
  const half = seedOrder(n / 2), res = [];
  half.forEach(x => { res.push(x); res.push(n - 1 - x); });
  return res;
}
function defaultRoundModes(total){
  const out = [];
  let size = Math.max(1, Number(total) || 1) / 2;
  while (size >= 1){
    out.push(size === 1 ? 'single' : 'two');
    size = size / 2;
  }
  return out;
}
function roundModeFor(t, roundIdx){
  const ko = t && t.knockouts;
  if (!ko) return 'single';
  const modes = ko.config && Array.isArray(ko.config.roundModes) ? ko.config.roundModes : [];
  const m = modes[roundIdx];
  if (m === 'single' || m === 'two') return m;
  const rounds = Array.isArray(ko.rounds) ? ko.rounds.length : 0;
  return roundIdx === rounds - 1 ? 'single' : 'two';
}
function koFindTie(t, matchId){
  const ko = t && t.knockouts;
  if (!ko || !Array.isArray(ko.rounds)) return null;
  for (let r = 0; r < ko.rounds.length; r++){
    const idx = (ko.rounds[r] || []).findIndex(m => m && m.id === matchId);
    if (idx !== -1) return { m: ko.rounds[r][idx], roundIdx: r, idx };
  }
  return null;
}
/* Propagate winners (and clear downstream results that no longer match). */
function autoAdvance(t){
  const ko = t && t.knockouts;
  if (!ko || !Array.isArray(ko.rounds) || ko.rounds.length < 2) return 0;
  let cleared = 0;
  for (let r = 0; r < ko.rounds.length - 1; r++){
    const cur = ko.rounds[r], next = ko.rounds[r + 1];
    cur.forEach((m, i) => {
      const w = matchWinner(m);
      const dst = next[Math.floor(i / 2)];
      if (!dst) return;
      const side = i % 2 === 0 ? 'homeId' : 'awayId';
      if (dst[side] !== (w || null)){
        if (tieHasResult(dst)){ clearTieResult(dst); cleared++; }
        dst[side] = w || null;
      }
    });
  }
  return cleared;
}
function champion(t){
  const ko = t.knockouts;
  if (!ko || !ko.rounds || !ko.rounds.length) return null;
  return matchWinner(ko.rounds[ko.rounds.length - 1][0]);
}
function tournamentStatus(t){
  if (!allTeams(t).length) return { key:'setup', label:'Setup' };
  const ch = champion(t);
  if (ch) return { key:'champ', label:'Champion' };
  if (t.knockouts) return { key:'ko', label:'Knockouts' };
  return { key:'group', label:'Group Stage' };
}
/* ordered qualifiers: group winners first (per-group counts), then best-placed wildcards */
function autoPicks(t, counts, wildcards){
  const order = [];
  groupsOf(t).forEach(g => {
    const rows = computeGroupTable(t, g.id);
    const n = Math.min(counts[g.id] || 0, rows.length);
    for (let i = 0; i < n; i++) order.push(rows[i].team.id);
  });
  const picked = new Set(order);
  const glob = computeTable(t);
  let w = Math.min(wildcards || 0, Math.max(0, allTeams(t).length - order.length));
  glob.forEach(r => { if (w > 0 && !picked.has(r.team.id)){ order.push(r.team.id); picked.add(r.team.id); w--; } });
  return order;
}
function qualifyCountFor(t, gid){
  const ko = t.knockouts;
  if (ko && ko.config && ko.config.counts && ko.config.counts[gid] != null) return ko.config.counts[gid];
  return 2; // default suggestion
}

function icsEscape(s){
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}
function icsStamp(ts){
  return new Date(ts).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
}
function icsDate(ts){
  return new Date(ts).toISOString().slice(0, 10).replace(/-/g, '');
}
function buildMatchICS(meta){
  const start = kickoffMs(meta.m);
  const title = meta.home + ' vs ' + meta.away + ' — Ceylon FC';
  const desc = meta.t.name + ' · ' + meta.round + ' · FC Mobile league';
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ceylon FC//FC Mobile League//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:' + String(meta.key).replace(/[^A-Za-z0-9_-]/g, '-') + '@ceylonfc',
    'DTSTAMP:' + icsStamp(Date.now())
  ];
  if (start){
    lines.push('DTSTART:' + icsStamp(start));
    lines.push('DTEND:' + icsStamp(start + 2 * 3600 * 1000));
  } else {
    const day = icsDate(Date.now());
    const next = icsDate(Date.now() + 86400000);
    lines.push('DTSTART;VALUE=DATE:' + day);
    lines.push('DTEND;VALUE=DATE:' + next);
  }
  lines.push('SUMMARY:' + icsEscape(title));
  lines.push('DESCRIPTION:' + icsEscape(desc));
  lines.push('LOCATION:' + icsEscape('Ceylon FC · FC Mobile'));
  lines.push('STATUS:CONFIRMED', 'END:VEVENT', 'END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadMatchICS(meta){
  try {
    if (typeof Blob !== 'function' || typeof URL === 'undefined' || !URL || typeof URL.createObjectURL !== 'function'){
      flash = '⚠️ This browser cannot download calendar files. Try a modern Chrome, Safari or Firefox.';
      render(); return;
    }
    const blob = new Blob([buildMatchICS(meta)], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ceylon-fc-' + String(meta.key).replace(/[^A-Za-z0-9_-]/g, '-') + '.ics';
    a.click();
    if (URL.revokeObjectURL) setTimeout(() => URL.revokeObjectURL(url), 1500);
    flash = '📅 Calendar file downloaded for ' + meta.home + ' vs ' + meta.away + '.';
    render();
  } catch (e){
    flash = '⚠️ Calendar download failed. Check that your browser allows downloads, then try again.';
    render();
  }
}

function selectedValues(id){
  try {

    if (!el) return null;
    if (el.selectedOptions && typeof el.selectedOptions.length === 'number'){

  } catch (e){ return null; }
}
function captureReportDraft(){
  if (!reportDraft) return;
  const body = document.getElementById('report-body');
  if (body && typeof body.value === 'string') reportDraft.report = body.value;
  const motm = document.getElementById('report-motm');
  if (motm && typeof motm.value === 'string') reportDraft.motmPlayerId = motm.value;
  const motmName = document.getElementById('report-motm-name');
  if (motmName && typeof motmName.value === 'string') reportDraft.motmName = motmName.value;
  reportDraft.scorers = (reportDraft.scorers || []).map(s => {
    const p = document.getElementById('report-scorer-player-' + s.id);
    const n = document.getElementById('report-scorer-name-' + s.id);
    const m = document.getElementById('report-scorer-minute-' + s.id);
    const tm = document.getElementById('report-scorer-team-' + s.id);
    const out = { id: s.id, playerId: s.playerId, name: s.name, teamId: s.teamId, minute: s.minute };
    if (p && typeof p.value === 'string') out.playerId = p.value;
    if (n && typeof n.value === 'string') out.name = n.value;
    if (m && typeof m.value === 'string') out.minute = Math.round(Number(m.value) || 0);
    if (tm && typeof tm.value === 'string') out.teamId = tm.value;
    return out;
  });
  const h = selectedValues('report-lineup-home'); if (h) reportDraft.lineups.home = h;
  const a = selectedValues('report-lineup-away'); if (a) reportDraft.lineups.away = a;

function saveReportDraft(){
  if (!reportDraft || !reportEditingKey || !unlocked) return false;
  captureReportDraft();
  const errs = [];
  const report = String(reportDraft.report || '').trim();
  if (report.length > 30000) errs.push('The report must be 30,000 characters or fewer.');
  (reportDraft.scorers || []).forEach((s, i) => {
    if (s.minute < 0 || s.minute > 130) errs.push('Scorer ' + (i + 1) + ' minute must be between 0 and 130.');
    if (!s.playerId && !String(s.name || '').trim()) errs.push('Scorer ' + (i + 1) + ' needs a player or a name.');
  });
  if ((reportDraft.gallery || []).length > 12) errs.push('Please keep the gallery to 12 screenshots or fewer.');
  if (errs.length){ reportError = errs[0] + (errs.length > 1 ? ' (+' + (errs.length - 1) + ' more to fix)' : ''); return false; }
  reportDraft.updatedAt = Date.now();
  state.site.reports[reportEditingKey] = deepClone(reportDraft);
  reportEditingKey = null; reportDraft = null; reportError = '';
  flash = '📄 Match report saved — it is live on the fixture page.';
  return true;
}

function predictionBox(key){ return (state.site.predictions || {})[key] || { entries: [] }; }

function predictionOpen(meta){
  if (!meta || meta.finished || !meta.homeId || !meta.awayId) return false;
  const k = kickoffMs(meta.m);
  return !k || Date.now() < k;
}
function predictionStatus(meta){
  if (meta.finished) return 'Result in';
  if (!predictionOpen(meta)) return 'Locked at kickoff';
  const k = kickoffMs(meta.m);
  return k ? 'Locks ' + localDateTime(meta.m.kickoff) : 'Open until kickoff is set';
}
function predictionPoints(entry, meta){
  if (!entry || !meta || !meta.finished) return null;
  const hs = Number(meta.hs), as = Number(meta.as);
  if (!Number.isFinite(hs) || !Number.isFinite(as)) return null;
  if (entry.home === hs && entry.away === as) return 3;
  const sign = (a, b) => a > b ? 1 : a < b ? -1 : 0;
  return sign(entry.home, entry.away) === sign(hs, as) ? 1 : 0;
}
function predictionLeaderboardRows(){
  const map = {};
  allMatches().forEach(meta => {
    if (!meta.finished) return;
    (predictionBox(meta.key).entries || []).forEach(e => {
      const pts = predictionPoints(e, meta);
      if (pts == null) return;
      const row = map[e.device] || { device: e.device, name: e.name || 'Fan', points: 0, exact: 0, total: 0, last: 0 };
      row.name = e.name || row.name;
      row.points += pts;
      if (pts === 3) row.exact += 1;
      row.total += 1;
      row.last = Math.max(row.last, Number(e.at) || 0);
      map[e.device] = row;
    });
  });
  return Object.keys(map).map(k => map[k]).sort((a, b) => b.points - a.points || b.exact - a.exact || a.name.localeCompare(b.name));
}

  options.forEach((label, i) => {

  });
  const seen = {};
  options.forEach(label => { const k = label.toLowerCase(); if (k && seen[k]) errs.push('Options must be different — “' + label + '” appears twice.'); seen[k] = true; });
  if (errs.length){ pollError = errs[0] + (errs.length > 1 ? ' (+' + (errs.length - 1) + ' more to fix)' : ''); return false; }

  if (existing){

const PLAYER_POSITIONS = ['GK', 'DEF', 'MID', 'FWD'];
function playerTeamMeta(p){
  const t = findTournament(p && p.tournamentId);
  return { t: t, name: t && p.teamId ? teamName(t, p.teamId) : '' };
}
function playerStats(p){
  const matches = allMatches().filter(m => m.finished && (m.homeId === p.teamId || m.awayId === p.teamId));
  matches.sort((a, b) => {
    const ka = kickoffMs(a.m) || Number(a.createdAt) || 0;
    const kb = kickoffMs(b.m) || Number(b.createdAt) || 0;
    return ka - kb;
  });
  let wins = 0, draws = 0, losses = 0, goals = 0, cleanSheets = 0, hatTricks = 0;
  let run = 0, longestUnbeaten = 0;
  matches.forEach(m => {
    const home = m.homeId === p.teamId;
    const mine = home ? m.hs : m.as;
    const theirs = home ? m.as : m.hs;
    if (mine > theirs){ wins += 1; run += 1; }
    else if (mine === theirs){ draws += 1; run += 1; }
    else { losses += 1; run = 0; }
    if (theirs === 0) cleanSheets += 1;
    longestUnbeaten = Math.max(longestUnbeaten, run);
    const rep = state.site.reports[m.key];
    if (rep){
      const g = (rep.scorers || []).filter(s => s.playerId === p.id).length;
      goals += g;
      if (g >= 3) hatTricks += 1;
    }
  });
  const baseXp = matches.length * 2 + wins * 10 + draws * 5 + goals * 5 + cleanSheets * 3;
  const xp = baseXp + (Number(p.bonusXp) || 0);
  return {
    matches: matches.length, wins: wins, draws: draws, losses: losses, goals: goals,
    cleanSheets: cleanSheets, hatTricks: hatTricks, longestUnbeaten: longestUnbeaten,
    baseXp: baseXp, xp: xp, level: Math.floor(xp / 100) + 1, progress: xp % 100
  };
}
function playerAutoBadges(p, stats){
  const out = [];
  if (stats.hatTricks > 0) out.push('Hat-trick');
  if (stats.cleanSheets > 0) out.push('Clean Sheet');
  if (stats.longestUnbeaten >= 3) out.push('Unbeaten Run');
  if (stats.goals > 0){
    let top = 0;
    (state.site.players || []).forEach(x => { const s = playerStats(x); if (s.goals > top) top = s.goals; });
    if (stats.goals === top) out.push('Golden Boot');
  }
  return out;
}
function playerAllBadges(p, stats){
  const auto = playerAutoBadges(p, stats);
  const manual = (p.badges || []).filter(Boolean);
  return Array.from(new Set(auto.concat(manual)));
}

function capturePlayerDraft(){
  if (!playerDraft) return;
  const get = id => { const el = document.getElementById(id); return el && typeof el.value === 'string' ? el.value : null; };
  const name = get('player-name'); if (name != null) playerDraft.name = name;
  const team = get('player-team');
  if (team != null){
    const opt = teamOptionsGlobal().find(x => x.id === team);
    playerDraft.teamId = opt ? opt.id : '';
    playerDraft.tournamentId = opt ? opt.tournamentId : '';
  }
  const pos = get('player-position'); if (pos != null) playerDraft.position = pos;
  const bonus = get('player-bonus'); if (bonus != null) playerDraft.bonusXp = Math.max(0, Math.round(Number(bonus) || 0));
  const url = get('player-photo-url'); if (url != null && url.trim()) playerDraft.photo = url.trim();
}
function savePlayerDraft(){
  if (!playerDraft || !unlocked) return false;
  capturePlayerDraft();
  const errs = [];
  const name = String(playerDraft.name || '').trim();
  if (name.length < 2) errs.push('Give the player a name of at least 2 characters.');
  else if (name.length > 60) errs.push('Player names must be 60 characters or fewer.');
  if (!playerDraft.teamId) errs.push('Choose the player’s team. Add teams in the League tab first.');
  if (PLAYER_POSITIONS.indexOf(playerDraft.position) === -1) errs.push('Choose a position: GK, DEF, MID or FWD.');
  if (playerDraft.photo && !safeImageSrc(playerDraft.photo)) errs.push('The player photo must be an uploaded image or a valid https image URL.');
  if (Number(playerDraft.bonusXp) < 0 || Number(playerDraft.bonusXp) > 100000) errs.push('Bonus XP must be between 0 and 100,000.');
  if (errs.length){ playerError = errs[0] + (errs.length > 1 ? ' (+' + (errs.length - 1) + ' more to fix)' : ''); return false; }
  const existing = playerEditingId && playerEditingId !== 'new' ? playerById(playerEditingId) : null;
  if (existing){
    existing.name = name; existing.teamId = playerDraft.teamId; existing.tournamentId = playerDraft.tournamentId;
    existing.position = playerDraft.position; existing.photo = playerDraft.photo; existing.bonusXp = Number(playerDraft.bonusXp) || 0;
    existing.badges = playerDraft.badges || [];
    flash = '👟 Player updated — the new card is live.';
  } else {
    state.site.players.push({
      id: uid('pl'), name: name, teamId: playerDraft.teamId, tournamentId: playerDraft.tournamentId,
      position: playerDraft.position, photo: playerDraft.photo, bonusXp: Number(playerDraft.bonusXp) || 0, badges: playerDraft.badges || []
    });
    flash = '👟 Player added — fans can now vote and pick them in fantasy.';
  }
  playerEditingId = null; playerDraft = null; playerError = '';
  return true;
}

const FANTASY_SLOTS = ['GK', 'DEF', 'DEF', 'DEF', 'DEF', 'MID', 'MID', 'MID', 'FWD', 'FWD', 'FWD'];
function fantasyRounds(){
  const out = [];
  state.tournaments.forEach(t => {
    const groupMatches = (t.matches || []).filter(m => m.homeId && m.awayId);
    if (groupMatches.length){
      const teamIds = Array.from(new Set(groupMatches.map(m => m.homeId).concat(groupMatches.map(m => m.awayId))));
      out.push({ key: t.id + ':G', label: t.name + ' · Group stage', short: 'Group stage', t: t, teamIds: teamIds });
    }
    const ko = t.knockouts;
    if (ko && Array.isArray(ko.rounds)){
      ko.rounds.forEach((round, ri) => {
        const ms = (round || []).filter(m => m.homeId && m.awayId);
        if (!ms.length) return;
        const teamIds = Array.from(new Set(ms.map(m => m.homeId).concat(ms.map(m => m.awayId))));
        out.push({ key: t.id + ':K' + ri, label: t.name + ' · ' + roundTitleFor(round.length), short: roundTitleFor(round.length), t: t, teamIds: teamIds });
      });
    }
  });
  return out;
}
function fantasyRoundMeta(key){
  return fantasyRounds().find(r => r.key === key) || null;
}
function fantasyStore(key){
  return (state.site.fantasy || {})[key] || { formation: '4-3-3', picks: [], note: '', submissions: [] };
}
function fantasyPlayerOptions(meta){
  if (!meta) return [];
  // Only players from teams actually involved in this round are eligible.
  return (state.site.players || []).filter(p => p.tournamentId === meta.t.id && meta.teamIds.indexOf(p.teamId) !== -1);
}

function saveNewsDraft(){
  if (!newsDraft || !unlocked) return false;
  captureNewsDraft();
  const errs = [];
  const title = String(newsDraft.title || '').trim();
  const category = NEWS_CATEGORIES.indexOf(newsDraft.category) !== -1 ? newsDraft.category : NEWS_CATEGORIES[0];
  const body = String(newsDraft.body || '').trim();
  const date = String(newsDraft.date || '').trim();
  const author = String(newsDraft.author || '').trim();
  const coverRaw = String(newsDraft.cover || '').trim();
  const cover = coverRaw ? safeImageSrc(coverRaw) : '';
  if (!title) errs.push('Give the article a title.');
  else if (title.length > 140) errs.push('The title must be 140 characters or fewer.');
  if (!body) errs.push('Write the article body before saving.');
  else if (body.length > 30000) errs.push('The article body must be 30,000 characters or fewer.');
  if (date && !Date.parse(date)) errs.push('Pick a valid article date.');
  if (author.length > 60) errs.push('The author name must be 60 characters or fewer.');
  if (coverRaw && !cover) errs.push('The cover must be an uploaded image or a valid https image URL.');
  if (errs.length){ newsError = errs[0] + (errs.length > 1 ? ' (+' + (errs.length - 1) + ' more to fix)' : ''); return false; }
  const existing = newsEditingId && newsEditingId !== 'new' ? newsById(newsEditingId) : null;
  if (existing){
    existing.title = title; existing.category = category; existing.cover = cover;
    existing.body = body; existing.date = date || new Date().toISOString().slice(0, 10);
    existing.author = author;
    flash = '📰 Article updated — readers see the new version immediately.';
  } else {
    state.site.news.push({
      id: uid('nw'), title, category, cover, body, date: date || new Date().toISOString().slice(0, 10),
      author, createdAt: Date.now()
    });
    flash = '📰 Article published — it is live on the News page and Home.';
  }
  newsEditingId = null; newsDraft = null; newsError = '';
  return true;
}
function shareHash(hash, title){
  let url = '';
  try {
    if (typeof location !== 'undefined' && location){
      url = (location.origin || '') + (location.pathname || '') + hash;
    }
  } catch (e){ /* no location */ }
  if (!url) url = hash;
  const done = ok => {
    flash = ok ? '🔗 Share link copied — send it to any Ceylon FC fan.' : '🔗 Share link: ' + url;
    render();
  };
  try {
    if (typeof navigator !== 'undefined' && navigator && typeof navigator.share === 'function'){
      navigator.share({ title: title || 'Ceylon FC', url }).then(() => done(true)).catch(() => {
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(() => done(true)).catch(() => done(false));
        } else done(false);
      });
      return;
    }
    if (typeof navigator !== 'undefined' && navigator && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => done(true)).catch(() => done(false));
      return;
    }
  } catch (e){ /* fall through */ }
  done(false);
}

  return `<main class="wrap">
    <div class="back-row">
      <button class="btn small" data-action="go-home">← All Tournaments</button>
      <span class="tname">${esc(t.name)}</span>
      <span class="status-pill st-${st.key}">${st.label}</span>
    </div>
    ${unlocked ? `
    <div class="form-row" style="margin-bottom:16px">
      <label>Rename tournament
        <input id="tournNameInput" value="${esc(t.name)}" maxlength="60" style="width:260px">
      </label>
      <button class="btn small" data-action="save-tournament-name">Save name</button>
    </div>` : ''}
    ${flashHTML()}
    <div class="tabs">
      <button class="tab-btn ${tab==='table'?'active':''}" data-action="tab" data-val="table">📊 Points Tables</button>
      <button class="tab-btn ${tab==='rankings'?'active':''}" data-action="tab" data-val="rankings">🏅 Rankings</button>
      <button class="tab-btn ${tab==='matches'?'active':''}" data-action="tab" data-val="matches">⚽ Matches</button>
      <button class="tab-btn ${tab==='knockouts'?'active':''}" data-action="tab" data-val="knockouts">🏆 Knockouts</button>
    </div>
    ${tab === 'table' ? tableTabHTML(t) : ''}
    ${tab === 'rankings' ? rankingsTabHTML(t) : ''}
    ${tab === 'matches' ? matchesTabHTML(t) : ''}
    ${tab === 'knockouts' ? knockoutsTabHTML(t) : ''}
  </main>`;
}

function activeGroup(t){
  if (!groupsOf(t).length) return null;
  if (!groupsOf(t).some(g => g.id === view.groupId)) view.groupId = groupsOf(t)[0].id;
  return findGroup(t, view.groupId);
}
/* ================= TABLE TAB ================= */
function tableTabHTML(t){
  const groups = groupsOf(t);
  const sel = activeGroup(t);
  const rows = sel ? computeGroupTable(t, sel.id) : [];
  const qCount = sel ? qualifyCountFor(t, sel.id) : 0;
  return `<div class="panel">
    <div class="group-bar">
      ${groups.map(g => `
        <button class="group-pill ${g.id === view.groupId ? 'active' : ''}" data-action="select-group" data-id="${g.id}">
          ${esc(g.name)}<span class="gcount">${g.teams.length}</span>
        </button>`).join('')}
      ${unlocked ? `<button class="group-pill add" data-action="add-group">＋ Add ${groups.length < 26 ? 'Group ' + nextGroupLetter(t) : 'Group'}</button>` : ''}
    </div>
    ${unlocked ? `<div class="wizard-launch">
      <div><strong>🧩 Group Setup Wizard</strong><small>Paste teams, pick the knockout size and let the app build groups and fixtures.</small></div>
      <button type="button" class="btn primary small" data-action="wizard-open">${groupWizardOpen ? 'Wizard open' : 'Open wizard'}</button>
    </div>` : ''}
    ${unlocked && groupWizardOpen ? groupWizardHTML(t) : ''}
    ${groups.length === 0 ? `<div class="empty-box">No groups yet. ${unlocked ? 'Add a group to get started, or use the Group Setup Wizard above.' : 'The admin needs to add groups.'}</div>` : ''}
    ${sel ? `
    ${unlocked ? `
    <div class="team-form">
      <div class="section-title">＋ Add Team to ${esc(sel.name)} <small>${sel.teams.length} team(s)</small></div>
      <form class="form-row" data-form="add-team">
        <label>Team / Player name
          <input id="newTeamName" maxlength="30" placeholder="e.g. ProGamer_99" autocomplete="off" required>
        </label>
        <label>Note (optional)
          <input id="newTeamNote" maxlength="40" placeholder="e.g. in-game club, alt account...">
        </label>
        <button class="btn primary" data-action="add-team" data-inline="1">＋ Add Team</button>
      </form>
    </div>` : ''}
    <div>
      <div class="section-title">📊 ${esc(sel.name)} — Standings
        <small>Win 3 · Draw 1 · Loss 0 → sort by Pts, GD, then GF</small>
      </div>
      ${rows.length === 0
        ? `<div class="empty-box" style="margin-top:12px">No teams in ${esc(sel.name)} yet.</div>`
        : `<div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
              </tr></thead>
              <tbody>
                ${rows.map((r,i) => {
                  const posClass = i===0?'pos10':i===1?'pos11':i===2?'pos1b':'';
                  const qual = rows.length > qCount && i < qCount;
                  return `<tr class="${qual?'qual-zone':''}">
                    <td class="pos ${posClass}">${r.rank}</td>
                    <td class="tname">${esc(r.team.name)} ${qual?'<span class="q-badge">QUALIFY</span>':''}</td>
                    <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
                    <td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?'+':''}${r.gd}</td>
                    <td class="pts-cell">${r.pts}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>`}
      ${rows.length > qCount && t.knockouts ? `<p class="hint" style="margin-top:8px">🟢 Green rows = the top ${qCount} from this group qualify for the knockouts.</p>` : ''}
    </div>
    ${unlocked ? `
    <div class="group-manager">
      <div class="section-title">🗂️ Manage Groups &nbsp;<small>add, rename or delete groups and move teams between them</small></div>
      ${groups.map(g => `
        <div class="gm-card">
          <div class="gm-head">
            <span class="gname">${esc(g.name)}</span>
            <input id="gname-${g.id}" value="${esc(g.name)}" maxlength="20">
            <button class="btn small" data-action="rename-group" data-id="${g.id}">Save name</button>
            <button class="btn danger small" data-action="delete-group" data-id="${g.id}">Delete</button>
            <span class="teams-count">${g.teams.length} team(s) · top ${qualifyCountFor(t, g.id)} qualify</span>
          </div>
          ${g.teams.length ? `
          <div class="roster">
            ${g.teams.map(team => `
            <div class="roster-row">
              <span class="dot"></span>
              <span class="rname">${esc(team.name)}</span>
              ${team.note ? `<span class="rnote">${esc(team.note)}</span>` : ''}
              <select data-team-group="${team.id}">
                ${groups.map(o => `<option value="${o.id}" ${o.id === g.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}
              </select>
              <button class="btn small" data-action="move-team" data-id="${team.id}">Move</button>
              <button class="btn danger small" data-action="delete-team" data-id="${team.id}">Remove</button>
            </div>`).join('')}
          </div>` : `<p class="hint" style="margin:4px 0 0">No teams in this group yet.</p>`}
        </div>`).join('')}
    </div>` : ''}
    ` : ''}
  </div>`;
}

/* ================= MATCHES TAB ================= */
function matchesTabHTML(t){
  const groups = groupsOf(t);
  if (!view.matchGroupId || !findGroup(t, view.matchGroupId)) view.matchGroupId = groups.length ? groups[0].id : null;
  const mg = findGroup(t, view.matchGroupId);
  const filtered = t.matches.filter(m => !view.matchFilter || m.groupId === view.matchFilter);
  const sorted = filtered.slice().reverse();
  return `<div class="panel">
    ${unlocked ? `
    <div class="match-form">
      <div class="section-title">＋ Record Match Result <small>both teams from the same group</small></div>
      <form class="form-row" data-form="add-match">
        <label>Group
          <select id="matchGroup">
            ${groups.map(g => `<option value="${g.id}" ${g.id === view.matchGroupId ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
          </select>
        </label>
        <label>Home team
          <select id="matchHome" required>
            <option value="">Select team…</option>
            ${(mg ? mg.teams : []).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
          </select>
        </label>
        <label>Goals
          <input id="matchHomeGoals" type="number" min="0" max="99" value="0" required>
        </label>
        <label>Away team
          <select id="matchAway" required>
            <option value="">Select team…</option>
            ${(mg ? mg.teams : []).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
          </select>
        </label>
        <label>Goals
          <input id="matchAwayGoals" type="number" min="0" max="99" value="0" required>
        </label>
        <button class="btn primary" data-action="add-match" data-inline="1">Record Result</button>
      </form>
      ${mg && mg.teams.length < 2 ? `<p class="hint">Add at least 2 teams to ${esc(mg.name)} (Points Tables tab) to record results.</p>` : ''}
    </div>` : ''}
    <div>
      <div class="section-title">📋 Recorded Matches <small>${t.matches.length}</small></div>
      ${groups.length > 1 ? `
      <div class="filter-bar" style="margin:10px 0">
        <button class="group-pill ${!view.matchFilter ? 'active' : ''}" data-action="filter-matches" data-id="">All</button>
        ${groups.map(g => `<button class="group-pill ${view.matchFilter === g.id ? 'active' : ''}" data-action="filter-matches" data-id="${g.id}">${esc(g.name)}</button>`).join('')}
      </div>` : ''}
      ${sorted.length === 0
        ? `<div class="empty-box" style="margin-top:12px">No matches recorded yet.</div>`
        : `<div class="match-list">${sorted.map(m => matchRowHTML(t, m)).join('')}</div>`}
    </div>
  </div>`;
}
function matchRowHTML(t, m){
  const g = findGroup(t, m.groupId) || groupOfTeam(t, m.homeId);
  if (editingMatchId === m.id && unlocked){
    const teams = g ? g.teams : allTeams(t);
    return `<div class="match-row">
      <div class="edit-form">
        <label>Home
          <select id="emHome"><option value="">—</option>${teams.map(x => `<option value="${x.id}" ${x.id===m.homeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
        </label>
        <input id="emHS" type="number" min="0" max="99" value="${m.homeGoals ?? ''}" placeholder="-">
        <label>Away
          <select id="emAway"><option value="">—</option>${teams.map(x => `<option value="${x.id}" ${x.id===m.awayId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
        </label>
        <input id="emAS" type="number" min="0" max="99" value="${m.awayGoals ?? ''}" placeholder="-">
        <label>Kickoff
          <input id="emKickoff" type="datetime-local" value="${esc(isoToLocalInput(m.kickoff))}">
        </label>
        <button class="btn primary small" data-action="save-match" data-id="${m.id}">Save</button>
        <button class="btn ghost small" data-action="cancel-match-edit">Cancel</button>
      </div>
    </div>`;
  }
  return `<div class="match-row">
    ${g ? `<span class="chip">${esc(g.name)}</span>` : ''}
    <div class="score-line">
      <span class="name ${m.homeGoals != null && m.awayGoals != null && m.homeGoals > m.awayGoals ? 'win-side' : ''}">${esc(teamName(t, m.homeId))}</span>
      <span class="goals">${m.homeGoals != null ? m.homeGoals : '—'}</span>
      <span class="vs">–</span>
      <span class="goals">${m.awayGoals != null ? m.awayGoals : '—'}</span>
      <span class="name ${m.homeGoals != null && m.awayGoals != null && m.awayGoals > m.homeGoals ? 'win-side' : ''}">${esc(teamName(t, m.awayId))}</span>
    </div>
    ${unlocked ? `<div style="display:flex;gap:6px">
      <button class="btn small" data-action="edit-match" data-id="${m.id}">Edit</button>
      <button class="btn danger small" data-action="delete-match" data-id="${m.id}">✕</button>
    </div>` : ''}
    ${m.homeGoals != null && m.awayGoals != null ? `<button type="button" class="btn small" data-action="open-match" data-id="${esc(matchKey(t, m, 'g'))}">📄 Report</button>` : ''}
  </div>`;
}

/* ================= KNOCKOUTS TAB ================= */
function knockoutRules(t){
  const c = t && t.knockouts && t.knockouts.config;
  const r = (c && c.rules) || {};
  return { awayGoals: !!r.awayGoals, extraTime: !!r.extraTime };
}
function roundHasResult(t, r){
  const ko = t && t.knockouts;
  const matches = ko && ko.rounds && ko.rounds[r];
  return !!(matches && matches.some(tieHasResult));
}
function groupStageStats(t){
  const ms = (t && t.matches) || [];
  const done = ms.filter(m => m && m.homeGoals != null && m.awayGoals != null).length;
  return { done: done, total: ms.length, complete: groupStageComplete(t) };
}
function koPendingHTML(t){
  const stats = groupStageStats(t);
  const pct = stats.total ? Math.round(stats.done / stats.total * 100) : 0;
  return `<div class="ko-pending">
    <div class="ko-pending-head">
      <div>
        <div class="section-title">⏳ Knockout bracket is ready <small>empty until the group stage finishes</small></div>
        <p class="hint">Round 1 will pair group winners with runners-up from different groups. Wildcards seed below the group qualifiers.</p>
      </div>
      ${unlocked && stats.complete ? `<button type="button" class="btn primary small" data-action="seed-bracket">🎯 Seed bracket from group tables</button>` : ''}
    </div>
    <div class="ko-progress"><i style="width:${pct}%"></i></div>
    <p class="hint">${stats.done}/${stats.total || 0} group fixtures have a result${stats.complete ? ' — ready to seed.' : stats.total ? ' — the bracket fills automatically after the last score.' : '. Generate group fixtures first.'}</p>
  </div>`;
}
function knockoutsTabHTML(t){
  const ko = t.knockouts;
  if (!ko){
    if (allTeams(t).length < 2){
      return `<div class="empty-box">Knockouts need at least <b>2</b> teams. Add teams to groups first, or use the Group Setup Wizard in the Points Tables tab.</div>`;
    }
    return knockoutSetupHTML(t);
  }
  const rounds = ko.rounds;
  const rules = knockoutRules(t);
  const pending = !!(ko.config && ko.config.pending);
  return `<div class="panel">
    ${koChampionBannerHTML(t)}
    ${pending ? koPendingHTML(t) : ''}
    ${unlocked ? `<div class="ko-admin-bar">
      <div class="ko-rule-row">
        <span class="ko-admin-label">Tie-break rules</span>
        <label><input type="checkbox" data-ko-rule="awayGoals" ${rules.awayGoals ? 'checked' : ''}> Away goals rule</label>
        <label><input type="checkbox" data-ko-rule="extraTime" ${rules.extraTime ? 'checked' : ''}> Extra time when level</label>
      </div>
      <button class="btn danger small" data-action="reset-bracket">↺ Reset / Rebuild Knockouts</button>
    </div>` : `<div class="ko-rule-row ko-rule-readonly"><span class="ko-admin-label">Tie-break rules</span>
      <span class="chip">Away goals: ${rules.awayGoals ? 'on' : 'off'}</span>
      <span class="chip">Extra time: ${rules.extraTime ? 'on' : 'off'}</span></div>`}
    <div class="ko-grid">
      ${rounds.map((matches, r) => `
        <div class="ko-round">
          <div class="ko-round-head">
            <h3>${roundTitleFor(matches.length)} <span class="rcount">(${matches.length} tie${matches.length!==1?'s':''})</span></h3>
            ${unlocked ? `<label class="ko-mode-pick" title="${roundHasResult(t, r) ? 'Changing is locked after the first result' : 'Choose before the first result'}">Legs
              <select data-ko-round-mode="${r}" ${roundHasResult(t, r) ? 'disabled' : ''}>
                <option value="single" ${roundModeFor(t, r)==='single'?'selected':''}>Single match</option>
                <option value="two" ${roundModeFor(t, r)==='two'?'selected':''}>Two legs</option>
              </select>
            </label>` : `<span class="chip ko-mode-badge">${roundModeFor(t, r)==='two'?'Two legs':'Single match'}</span>`}
          </div>
          <div class="ko-matches">
            ${matches.map((m, i) => koCardHTML(t, m, roundTitleFor(matches.length), r, i)).join('')}
          </div>
        </div>`).join('')}
    </div>
    ${koAnalysisHTML(t)}
  </div>`;
}
function koTeamLineHTML(t, id, score, winId){
  const name = id ? teamName(t, id) : '— TBD —';
  return `<div class="team-line ${winId && id === winId ? 'winner' : ''}">
    <span class="tname">${id ? esc(name) : name}</span>
    ${winId && id === winId ? '<span class="trophy">🏆</span>' : ''}
    ${score != null ? `<span class="tscore">${esc(score)}</span>` : ''}
  </div>`;
}
function koReportLegsHTML(meta){
  const m = meta && meta.m;
  if (!m || !isTwoLeg(m)) return '';
  const a = tieAggregate(m);
  if (!a.leg1 && !a.leg2) return '';
  const home = meta.home || 'TBD';
  const away = meta.away || 'TBD';
  const legLine = (hName, aName, h, aw) => `<div class="report-leg-line">
    <span>${esc(hName)}</span><b>${h != null ? esc(h) : '–'} – ${aw != null ? esc(aw) : '–'}</b><span>${esc(aName)}</span>
  </div>`;
  return `<div class="ko-legs report-legs">
    <div class="ko-leg">
      <div class="ko-leg-title">Leg 1 <small>${esc(home)} at home</small></div>
      ${legLine(home, away, a.l1h, a.l1a)}
    </div>
    <div class="ko-leg">
      <div class="ko-leg-title">Leg 2 <small>${esc(away)} at home${a.leg2 ? '' : ' · result pending'}</small></div>
      ${!a.leg2 ? '<p class="hint">Leg 2 has not been recorded yet.</p>' : legLine(away, home, a.l2h, a.l2a)}
    </div>
    ${a.leg2 ? `<div class="ko-aggregate ${a.complete ? 'is-final' : ''}">
      <span>Aggregate</span><b>${esc(a.aggH)}–${esc(a.aggA)}</b>
      <small>${a.winnerId ? 'Tie decided' : 'Level — tie-break needed'}</small>
    </div>` : ''}
  </div>`;
}
function koHowWon(t, m){
  const a = tieAggregate(m);
  if (!a.winnerId) return '';
  const score = a.winnerSide === 'home' ? `${a.aggH}–${a.aggA}` : `${a.aggA}–${a.aggH}`;
  if (a.decidedBy === 'penalties'){
    return `Won ${a.penH ?? '?'}–${a.penA ?? '?'} on penalties after a ${score} ${a.two ? 'aggregate' : 'match'}`;
  }
  if (a.decidedBy === 'away-goals') return `Won on away goals after a ${score} aggregate`;
  let extra = a.usedEt ? ' after extra time' : '';
  if (a.two && a.leg1 && a.leg2){
    const behind = a.winnerSide === 'home' ? a.l1h < a.l1a : a.l1a < a.l1h;
    if (behind){
      const gf = a.winnerSide === 'home' ? a.l2a : a.l2h;
      const ga = a.winnerSide === 'home' ? a.l2h : a.l2a;
      extra += ` after a ${gf}–${ga} second-leg win`;
    }
  }
  return `Won ${score} on ${a.two ? 'aggregate' : 'the night'}${extra}`;
}
function koCardHTML(t, m, roundTitle, roundIdx, idx){
  const a = tieAggregate(m);
  const win = a.winnerId;
  const two = roundModeFor(t, roundIdx) === 'two' || isTwoLeg(m);
  const isFinal = roundIdx >= (t.knockouts.rounds.length - 1);
  const rules = knockoutRules(t);
  const pending = !!(t.knockouts.config && t.knockouts.config.pending);
  const leg1Ready = a.leg1;
  const scoreText = a.complete ? `${a.aggH}–${a.aggA}` : (a.leg1 ? `${a.aggH}–${a.aggA}` : '–');
  return `<div class="ko-card">
    <div class="mhead">
      <span>${esc(roundTitle)} · Tie ${idx+1}</span>
      ${win ? '<span class="win-stamp">🏆 WINNER</span>' : '<span style="color:var(--dim)">Pending</span>'}
    </div>
    <div class="ko-legs">
      <div class="ko-leg">
        <div class="ko-leg-title">Leg 1</div>
        <div class="pair">
          ${koTeamLineHTML(t, m.homeId, a.l1h, win)}
          ${koTeamLineHTML(t, m.awayId, a.l1a, win)}
        </div>
      </div>
      ${two ? `<div class="ko-leg">
        <div class="ko-leg-title">Leg 2 <small>venues swapped</small></div>
        <div class="pair">
          ${koTeamLineHTML(t, m.awayId, a.l2h, win)}
          ${koTeamLineHTML(t, m.homeId, a.l2a, win)}
        </div>
      </div>` : ''}
    </div>
    ${two ? `<div class="ko-aggregate ${a.complete ? 'is-final' : ''}">
      <span>Aggregate</span><b>${esc(scoreText)}</b>
      <small>${a.complete ? (win ? 'Tie decided' : 'Level — tie-break needed') : 'Leg 2 result pending'}</small>
    </div>` : ''}
    ${a.penH != null && a.penA != null ? `<div class="pen-line">Penalties <b>${esc(a.penH)}–${esc(a.penA)}</b>${a.penWinner ? ` · ${esc(teamName(t, a.penWinner === 'home' ? m.homeId : m.awayId))} won the shootout` : ''}</div>` : ''}
    ${a.usedEt ? `<div class="pen-line">Extra time played${a.etH != null || a.etA != null ? ` · ${esc(a.etH || 0)}–${esc(a.etA || 0)}` : ''}</div>` : ''}
    ${win ? `<div class="ko-how">${esc(koHowWon(t, m))}</div>` : ''}
    ${a.complete ? `<div class="ko-report"><button type="button" class="btn small" data-action="open-match" data-id="${esc(matchKey(t, m, 'k'))}">📄 Match report</button></div>` : ''}
    ${pending ? `<p class="hint ko-lock-hint">Waiting for the group stage — this tie fills automatically from the final group tables.</p>` : ''}
    ${unlocked && !pending ? `
    <div class="forms ko-edit-form">
      <div class="ko-form-line">
        <select data-ko-home="${m.id}">
          <option value="">— home —</option>
          ${allTeams(t).map(x => `<option value="${x.id}" ${x.id===m.homeId?'selected':''}>${esc(x.name)}</option>`).join('')}
        </select>
        <select data-ko-away="${m.id}">
          <option value="">— away —</option>
          ${allTeams(t).map(x => `<option value="${x.id}" ${x.id===m.awayId?'selected':''}>${esc(x.name)}</option>`).join('')}
        </select>
      </div>
      <div class="ko-form-line">
        <label>Leg 1 home <input data-ko-hs="${m.id}" type="number" min="0" max="99" value="${m.homeScore ?? ''}" placeholder="-" inputmode="numeric"></label>
        <label>Leg 1 away <input data-ko-as="${m.id}" type="number" min="0" max="99" value="${m.awayScore ?? ''}" placeholder="-" inputmode="numeric"></label>
      </div>
      ${two ? `<div class="ko-form-line">
        <label>Leg 2 home <input data-ko-l2h="${m.id}" type="number" min="0" max="99" value="${m.leg2HomeScore ?? ''}" placeholder="-" inputmode="numeric" ${leg1Ready ? '' : 'disabled'}></label>
        <label>Leg 2 away <input data-ko-l2a="${m.id}" type="number" min="0" max="99" value="${m.leg2AwayScore ?? ''}" placeholder="-" inputmode="numeric" ${leg1Ready ? '' : 'disabled'}></label>
      </div>
      <p class="hint ko-lock-hint">${leg1Ready ? 'Leg 2 uses the same teams with home and away swapped.' : 'Enter and save Leg 1 before Leg 2.'}</p>` : ''}

/* groupOptions(teamCount, knockoutSize, doubleRound) returns group-break
   cards, best first. It is intentionally self-contained so the wizard maths
   can be swapped with group-options.js without touching the UI. */
function groupOptions(teamCount, knockoutSize, doubleRound){
  const n = Math.max(0, Math.floor(Number(teamCount) || 0));
  const k = Math.max(2, Math.floor(Number(knockoutSize) || 0));
  if (n < 2 || k < 2 || (k & (k - 1)) !== 0) return [];
  const out = [];
  for (let g = 1; g <= Math.floor(n / 2); g++){
    const base = Math.floor(n / g), rem = n % g;
    if (base < 2) continue;
    const sizes = Array.from({ length: g }, (_, i) => base + (i < rem ? 1 : 0));
    const minSize = Math.min.apply(null, sizes), maxSize = Math.max.apply(null, sizes);
    for (let q = 1; q <= Math.min(minSize, k); q++){
      const wildcards = k - g * q;
      if (wildcards < 0) continue;
      if (wildcards > 0 && wildcards > n - g * q) continue;
      const perTeamMin = (minSize - 1) * (doubleRound ? 2 : 1);
      const perTeamMax = (maxSize - 1) * (doubleRound ? 2 : 1);
      const totalGroupMatches = sizes.reduce((sum, size) => sum + size * (size - 1) / 2, 0) * (doubleRound ? 2 : 1);
      const koTies = k - 1;
      const koMatches = Math.max(1, 2 * koTies - 1); // two legs by default, single-leg final
      const equal = maxSize === minSize;
      const score = (equal ? 0 : 8) + Math.abs(maxSize - 4) * 2 + Math.abs(q - 2) * 3 +
        wildcards * 5 + (g < 2 ? 12 : 0) + (minSize < 3 ? 5 : 0);
      out.push({
        id: 'go-' + g + '-' + q + '-' + wildcards,
        groupCount: g, sizes: sizes, qualifiersPerGroup: q, wildcards: wildcards,
        direct: g * q, totalGroupMatches: totalGroupMatches,
        gamesMin: perTeamMin, gamesMax: perTeamMax,
        koTies: koTies, koMatches: koMatches, equal: equal, score: score,
        title: g + ' group' + (g === 1 ? '' : 's') + ', top ' + q + ' advance' +
          (wildcards ? ' + ' + wildcards + ' wildcard' + (wildcards === 1 ? '' : 's') : '')
      });
    }
  }
  out.sort((a, b) => a.score - b.score || b.groupCount - a.groupCount || a.wildcards - b.wildcards);
  out.slice(0, 30).forEach((o, i) => {
    o.recommended = i === 0;
    o.tags = [];
    if (i === 0) o.tags.push('Recommended');
    o.tags.push(o.equal ? 'Equal groups' : 'Uneven groups');
    if (o.wildcards) o.tags.push(o.wildcards + ' wildcard' + (o.wildcards === 1 ? '' : 's'));
  });
  return out.slice(0, 30);
}

    if (prev) usedPrev.add(prev.id);

    const order = shuffleArr(groups.map((_, i) => i));

      const item = { id: rows[i].team.id, group: g.id, pos: i, row: rows[i], groupName: g.name };
      direct.push(item);
      if (i === 0) winners.push(item);
      else if (i === 1) runners.push(item);
      else other.push(item);
    }
  });
  const picked = new Set(direct.map(x => x.id));
  const wc = [];
  let w = Math.max(0, wildcards || 0);
  computeTable(t).forEach(r => {
    if (w > 0 && !picked.has(r.team.id)){
      const g = groupOfTeam(t, r.team.id);
      wc.push({ id: r.team.id, group: g ? g.id : '', pos: 90, row: r });
      picked.add(r.team.id); w--;
    }
  });
  return { direct, winners, runners, other, wildcards: wc, all: direct.concat(wc) };
}
function buildFirstRoundPairs(t, counts, wildcards, total){
  const q = qualifierRows(t, counts, wildcards);
  const used = new Set();
  const pairs = [];
  const all = q.all.slice();
  const chooseOpponent = (anchor, lists) => {
    const candidates = [].concat.apply([], lists).filter(x => x && !used.has(x.id) && x.id !== anchor.id);
    return candidates.find(x => x.group !== anchor.group) || candidates[0] || null;
  };
  // Group winners first: ideally against a runner-up from another group.
  q.winners.forEach(w => {
    if (used.has(w.id) || pairs.length >= total / 2) return;
    const opp = chooseOpponent(w, [q.runners, q.other, q.wildcards, q.all]);
    if (opp){ pairs.push([w, opp]); used.add(w.id); used.add(opp.id); }
  });
  // Then remaining direct qualifiers, avoiding same-group meetings where possible.
  let remaining = all.filter(x => !used.has(x.id));
  while (remaining.length && pairs.length < total / 2){
    const a = remaining.shift();
    if (used.has(a.id)) continue;
    let idx = remaining.findIndex(x => !used.has(x.id) && x.group !== a.group);
    if (idx < 0) idx = remaining.findIndex(x => !used.has(x.id));
    const b = idx >= 0 ? remaining.splice(idx, 1)[0] : null;
    if (!b) break;
    pairs.push([a, b]); used.add(a.id); used.add(b.id);
  }
  // Safety net for incomplete source data: use the ordered auto picks.
  if (pairs.length < total / 2){
    const ordered = autoPicks(t, counts, wildcards);
    for (let i = 0; i < ordered.length && pairs.length < total / 2; i += 2){
      if (ordered[i] && ordered[i + 1]) pairs.push([{ id: ordered[i] }, { id: ordered[i + 1] }]);
    }
  }
  return pairs.map(p => [p[0].id, p[1].id]);
}
function buildWizardBracket(t, counts, wildcards, total){
  const rounds = makeRounds(total);
  const pairs = buildFirstRoundPairs(t, counts, wildcards, total);
  pairs.forEach((pair, i) => {
    if (!rounds[0][i]) return;
    rounds[0][i].homeId = pair[0] || null;
    rounds[0][i].awayId = pair[1] || null;
  });
  return rounds;
}
function groupStageComplete(t){
  const ms = (t && t.matches) || [];
  return ms.length > 0 && ms.every(m => m && m.homeGoals != null && m.awayGoals != null);
}
/* The wizard creates an empty bracket. Once every group fixture has a score,
   fill round one from the real group tables (winners first, then runners-up
   from different groups, with wildcards lower down). */
function seedPendingBracket(t){
  const ko = t && t.knockouts;
  if (!ko || !ko.config || !ko.config.pending) return false;
  if (!groupStageComplete(t)) return false;
  const counts = ko.config.counts || {};
  const wildcards = Math.max(0, Number(ko.config.wildcards) || 0);
  const total = groupsOf(t).reduce((s, g) => s + (Number(counts[g.id]) || 0), 0) + wildcards;
  if (!VALID_N.includes(total) || total > allTeams(t).length) return false;
  ko.rounds = buildWizardBracket(t, counts, wildcards, total);
  ko.config.pending = false;
  ko.config.roundModes = defaultRoundModes(total);
  autoAdvance(t);
  return true;
}
function groupWizardLock(t){
  const d = groupWizardDraft;
  if (!d || !t) return false;
  const opt = groupWizardSelected(d);
  if (!opt){ groupWizardError = 'Pick a group-break card first.'; render(); return false; }
  if (d.drawing){ groupWizardError = 'Wait for the draw to finish, then lock.'; render(); return false; }
  const all = [];
  d.groups.forEach(g => g.teams.forEach(id => all.push(id)));
  if (all.length !== d.teams.length || new Set(all).size !== d.teams.length){
    groupWizardError = 'Every team must be placed in exactly one group before locking.'; render(); return false;
  }
  if (d.groups.some(g => g.teams.length !== g.capacity)){
    groupWizardError = 'Each group must be full before locking. Check the group sizes in the preview.'; render(); return false;
  }
  const existing = groupsOf(t).some(g => g.teams.length > 0) || (t.matches || []).length > 0 || !!t.knockouts;
  if (existing && typeof confirm === 'function' &&
      !confirm('Replace the current groups, group fixtures and knockout bracket? Existing results will be removed. This cannot be undone.')){
    return false;
  }
  const conflict = d.conflicts.length ? ' Club/tag clashes were accepted.' : '';
  const newGroups = d.groups.map((g, gi) => ({
    id: uid('g'),
    name: 'Group ' + wizardGroupLetter(gi),
    teams: g.teams.map(id => {
      const old = wizardTeamById(d, id);
      return { id: uid('tm'), name: old ? old.name : 'Team', note: old ? [old.club, old.tag].filter(Boolean).join(' · ') : '', club: old ? old.club : '', tag: old ? old.tag : '' };
    })
  }));
  // Draft teams don't carry new IDs, so map by original id -> new id.
  const idMap = {};
  d.groups.forEach((g, gi) => g.teams.forEach((oldId, ti) => { idMap[oldId] = newGroups[gi].teams[ti].id; }));
  t.groups = newGroups;
  t.matches = [];
  newGroups.forEach((g, gi) => {
    const ids = g.teams.map(x => x.id);
    roundRobinIds(ids, d.doubleRound).forEach(pair => {
      t.matches.push({ id: uid('m'), groupId: g.id, homeId: pair[0], awayId: pair[1], homeGoals: null, awayGoals: null, kickoff: '' });
    });
  });
  const counts = {};
  newGroups.forEach(g => { counts[g.id] = opt.qualifiersPerGroup; });
  const total = opt.groupCount * opt.qualifiersPerGroup + opt.wildcards;
  // Keep the bracket empty until the group stage has real results. The first
  // round is seeded from the group tables by seedPendingBracket().
  t.knockouts = {
    config: {
      counts: counts, wildcards: opt.wildcards,
      groupPlan: { groupCount: opt.groupCount, sizes: opt.sizes.slice(), qualifiersPerGroup: opt.qualifiersPerGroup, doubleRound: d.doubleRound },
      roundModes: defaultRoundModes(total),
      rules: { awayGoals: false, extraTime: false },
      pending: true
    },
    rounds: makeRounds(total)
  };
  autoAdvance(t);
  view = { type:'tournament', id:t.id, groupId:newGroups[0].id, matchGroupId:newGroups[0].id,
           matchFilter:null, pickOverrides:{}, qgValues:{}, wildcards:0 };
  tab = 'table';
  groupWizardOpen = false; groupWizardDraft = null; groupWizardError = '';
  if (groupWizardTimer){ clearTimeout(groupWizardTimer); groupWizardTimer = null; }
  flash = '🧩 Groups locked — ' + opt.groupCount + ' groups, ' + t.matches.length + ' group fixtures and an empty ' + total + '-team knockout bracket created.';
  save('Created groups with the Group Setup Wizard (' + opt.title + ', ' + total + '-team knockout, empty bracket)' + conflict);
  render();
  return true;
}

/* personalised tips for the next tournament, based on this team's stats */
function adviceFor(t, row){
  const r1 = n => Math.round(n * 10) / 10;
  const g = groupOfTeam(t, row.team.id);
  const gsize = g ? g.teams.length : 0;
  const maxP = Math.max(0, gsize - 1);
  const tips = [];
  if (row.p === 0){
    tips.push('Did not play a match this tournament — sign up early and get on the pitch from day one.');
  } else {
    const gpg = row.gf / row.p, gapg = row.ga / row.p;
    if (gpg < 0.8) tips.push('Attack needs more bite — only ' + r1(gpg) + ' goal(s) per game. Add finishing drills to your training.');
    else if (gpg >= 2.2) tips.push('You have a deadly attack (' + r1(gpg) + ' goals/game) — keep the front line together.');
    if (gapg > 1.6) tips.push('Your defence leaks ' + r1(gapg) + ' goal(s) per game — tighten the back line and trust your keeper.');
    else if (gapg <= 0.4 && row.p >= 2) tips.push('Rock-solid defence (' + r1(gapg) + ' conceded/game) — keep that back line intact next tournament.');
    if (row.d > 0 && row.d / row.p > 0.4 && row.p >= 3) tips.push('Too many draws — fine margins cost points. Practise killing games off late.');
    if (row.l / row.p > 0.5) tips.push('You lose more than you win — rebuild your tactics around your strongest players.');
    if (maxP > 0 && row.p < maxP) tips.push(row.p + ' of ' + maxP + ' group match(es) played — the games still ahead can change everything.');
    if (row.pts / (row.p * 3) >= 0.7 && row.p >= 2) tips.push('Elite form — ' + Math.round(row.pts / (row.p * 3) * 100) + '% of possible points. Carry the confidence into the next draw.');
    if (row.pts === 0) tips.push('Pointless this time — a clean slate; rebuild and bounce back stronger.');
  }
  if (maxP > 0){
    const gr = computeGroupTable(t, g.id).findIndex(r => r.team.id === row.team.id) + 1;
    if (gr === 1) tips.push('Group winner — bookmaker favourite for the next title.');
    else if (gr <= Math.ceil(gsize / 2)) tips.push('Finished top-' + gr + ' of ' + g.name + ' — a genuine contender next time.');
    else tips.push('Bottom-half finish (' + gr + ' of ' + gsize + ') — rethink your approach before the next draw.');
  }
  if (champion(t) === row.team.id) tips.unshift('Defending champion! Everyone will be gunning for you — evolve your squad or get dethroned.');
  if (!tips.length) tips.push('Keep playing and stay consistent — every match is a lesson for the next tournament.');
  return tips.slice(0, 3);
}

function moveItem(arr, id, dir){

  if (i < 0) return;
  const j = dir === 'down' ? i + 1 : i - 1;

function saveAbout(){
  if (!aboutDraft || !unlocked) return false;
  captureAboutDraft();
  const errors = [];
  const season = String(aboutDraft.season || '').trim();
  if (!season) errors.push('A season label is required.');
  else if (season.length > 60) errors.push('The season label must be 60 characters or fewer.');
  const logoRaw = String(aboutDraft.logo || '').trim();
  const logo = logoRaw ? safeImageSrc(logoRaw) : '';
  if (logoRaw && !logo) errors.push('The club logo must be an uploaded image or a valid https link.');
  const text = {};
  ['story', 'mission', 'format'].forEach(k => {
    const v = String(aboutDraft.about[k] || '').trim();
    if (v.length > 4000) errors.push(k.charAt(0).toUpperCase() + k.slice(1) + ' must be 4,000 characters or fewer.');
    text[k] = v;
  });
  const staff = [];
  aboutDraft.about.staff.forEach((p, i) => {
    const name = String(p.name || '').trim();
    const role = String(p.role || '').trim();

    if (role.length > 80) errors.push('Staff role ' + (i + 1) + ' must be 80 characters or fewer.');
    const photo = photoRaw ? safeImageSrc(photoRaw) : '';
    if (photoRaw && !photo) errors.push('The photo for ' + (name || 'staff member ' + (i + 1)) + ' must be an uploaded image or a valid https link.');
    staff.push({ id: p.id || uid('st'), name, role, photo });
  });
  const links = [];
  aboutDraft.about.links.forEach(l => {
    const platform = PLATFORMS[l.platform] ? l.platform : 'website';
    let label = String(l.label || '').trim();
    if (!label) label = PLATFORMS[platform].label;
    if (label.length > 40) errors.push('Link label "' + label.slice(0, 30) + '" must be 40 characters or fewer.');
    const urlRaw = String(l.url || '').trim();
    const url = urlRaw ? safeUrl(urlRaw) : '';
    if (urlRaw && !url) errors.push('The link "' + label + '" needs a valid http(s) address.');
    links.push({ id: l.id || uid('lk'), label, platform, url });
  });
  const sponsors = [];
  aboutDraft.about.sponsors.forEach((p, i) => {
    const name = String(p.name || '').trim();
    if (!name) errors.push('Sponsor ' + (i + 1) + ' needs a name.');
    else if (name.length > 60) errors.push('Sponsor name ' + (i + 1) + ' must be 60 characters or fewer.');
    const urlRaw = String(p.url || '').trim();
    const url = urlRaw ? safeUrl(urlRaw) : '';
    if (urlRaw && !url) errors.push('Sponsor "' + (name || i + 1) + '" needs a valid http(s) website.');
    const logoRaw = String(p.logo || '').trim();
    const logo = logoRaw ? safeImageSrc(logoRaw) : '';
    if (logoRaw && !logo) errors.push('Sponsor "' + (name || i + 1) + '" needs a valid logo image/link.');

  });
  if (errors.length){
    aboutError = errors[0] + (errors.length > 1 ? ' (+' + (errors.length - 1) + ' more to fix)' : '');
    return false;
  }
  state.site.season = season;
  state.site.logo = logo;
  state.site.about = Object.assign({}, text, { staff, links, sponsors });
  aboutEditing = false;
  aboutDraft = null;
  aboutError = '';
  flash = '✅ About page updated — the whole site now shows the new club info.';

}
function readImageFile(file, onReady, setErr){
  const fail = msg => {
    if (typeof setErr === 'function') setErr(msg);
    else aboutError = msg;
    render();
  };
  if (!file) return;
  const type = String(file.type || '').toLowerCase();
  if (!/^image\/(png|jpe?g|webp|gif)$/.test(type)){
    fail('Please choose a PNG, JPG, WEBP or GIF image.');
    return;
  }
  if (typeof file.size === 'number' && file.size > 500 * 1024){
    fail('That image is too large — please use one under 500 KB.');
    return;
  }
  if (typeof FileReader !== 'function'){
    fail('Image upload is not supported by this browser. Paste an image URL instead.');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const src = String(reader.result || '');
    if (!safeImageSrc(src)){ fail('That image could not be read. Try a different PNG, JPG, WEBP or GIF.'); return; }
    if (typeof setErr === 'function') setErr('');
    else aboutError = '';
    onReady(src);
  };
  reader.onerror = () => { fail('That image could not be read. Try a different PNG, JPG, WEBP or GIF.'); };
  reader.readAsDataURL(file);
}

function afterRender(){
  // Count-up numbers: honour counters + XP levels. Skipped entirely for reduced-motion users.
  try {
    if (typeof requestAnimationFrame !== 'function' || typeof document.querySelectorAll !== 'function') return;
    const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const nodes = document.querySelectorAll('[data-count]');
    if (!nodes || !nodes.length) return;
    if (reduce) return;
    const list = Array.prototype.slice.call(nodes);
    list.forEach(el => {
      const target = Math.max(0, Number(el.getAttribute('data-count')) || 0);
      el.textContent = '0';
      const start = Date.now();
      const step = () => {
        const p = Math.min(1, (Date.now() - start) / 900);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = String(Math.round(target * eased));
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = String(target);
      };
      requestAnimationFrame(step);
    });
  } catch (e){ /* keep static numbers */ }
}

function adminToken(){ return sessionStorage.getItem('fcm_token'); }
function clearAdminSession(){

function applyServerSession(d, fallbackName){
  sessionStorage.setItem('fcm_token', d.token);

async function adminFetch(path, body){
  const tok = adminToken();
  const headers = {};
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  const opts = { method: body === undefined ? 'GET' : 'POST', headers: headers };
  if (body !== undefined){
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  let d = null;
  try { d = await res.json(); } catch (e){ /* non-JSON */ }
  if (res.status === 401){
    clearAdminSession();
    flash = 'Session expired — please log in again.';
    render();
    throw new Error('Session expired — please log in again.');
  }
  if (!res.ok) throw new Error((d && d.error) || 'Request failed (' + res.status + ').');
  return d || {};
}
function loginGuardDoc(){
  const d = readJsonStorage(LOGIN_GUARD_KEY, {});
  return d && typeof d === 'object' && !Array.isArray(d) ? d : {};
}
function localLoginLocked(key){
  const row = loginGuardDoc()[key];
  return !!(row && Number(row.until) > Date.now());
}
function localLoginFailed(key){
  const doc = loginGuardDoc();
  const now = Date.now();
  const row = doc[key];
  const fresh = !row || !row.last || now - Number(row.last) > 15 * 60 * 1000;
  const count = fresh ? 1 : (Number(row.count) || 0) + 1;
  const locked = count >= 5;
  doc[key] = { count: count, last: now, until: locked ? now + 5 * 60 * 1000 : 0 };
  writeJsonStorage(LOGIN_GUARD_KEY, doc);
  return locked;
}
function localLoginSucceeded(key){
  const doc = loginGuardDoc();
  if (doc[key]){ delete doc[key]; writeJsonStorage(LOGIN_GUARD_KEY, doc); }
}
async function performLogin(username, password){
  const clean = String(username || '').trim();
  if (IS_SERVER){
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: clean, password: password })
    });
    let d = null;
    try { d = await res.json(); } catch (e){ /* non-JSON */ }
    if (!res.ok || !d || !d.token) throw new Error((d && d.error) || 'Wrong username or password.');
    applyServerSession(d, clean);
    flash = '✅ Logged in as ' + (d.name || clean) + ' — you can edit.';
    await refreshFromServer();
    render();
    return;
  }
  const key = normalizeUsername(clean);
  if (localLoginLocked(key)) throw new Error('Too many failed attempts. Try again in 5 minutes.');
  const user = adminAccounts.users.find(u => normalizeUsername(u.username) === key);
  const ok = !!user && await verifyLocalPassword(user, password);
  if (!ok){
    const locked = localLoginFailed(key);
    throw new Error(locked ? 'Too many failed attempts. Try again in 5 minutes.' : 'Wrong username or password.');
  }
  localLoginSucceeded(key);
  user.lastLoginAt = Date.now();
  saveAdminAccounts();
  applyLocalSession(user);
  recordLocalActivity('Logged in');
  flash = '✅ Logged in as ' + (user.display || user.username) + ' — you can edit.';
  render();
}

  const wasName = currentAdminName();
  const tok = adminToken();
  if (IS_SERVER && tok){
    fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok } }).catch(() => {});
  } else if (!IS_SERVER && unlocked && wasName){

async function loadAdminAccounts(){

}
function generateOneTimePassword(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';
  const bytes = randomBytes(18);
  let out = '';
  for (let i = 0; i < bytes.length; i++) out += alphabet[bytes[i] % alphabet.length];
  adminGeneratedPassword = out;
  const pass = document.getElementById('auPass');
  if (pass) pass.value = out;
  const slot = document.getElementById('adminOtp');
  if (slot){
    slot.innerHTML = `<div><strong>One-time password</strong> — copy it now and share it privately. It is shown once, never written to the activity log.</div><code>${esc(out)}</code>`;
    slot.classList.add('show');
  } else {
    render();
  }
}
async function addAdminAccount(username, password, display){
  if (!isHeadAdmin()) throw new Error('Only the head admin can manage admin accounts.');
  const clean = String(username || '').trim();
  if (normalizeUsername(clean).length < 3) throw new Error('Username must be at least 3 characters.');
  if (String(password || '').length < 4) throw new Error('Password must be at least 4 characters.');

    flash = '✅ Admin account "' + (d.display || clean) + '" created.';

    const key = normalizeUsername(clean);
    if (adminAccounts.users.some(u => normalizeUsername(u.username) === key)) throw new Error('That username already exists.');
    const user = await makeLocalUser(clean, password, display, 'admin');
    adminAccounts.users.push(user);

    recordLocalActivity('Added admin "' + (user.display || user.username) + '"');

  if (!isHeadAdmin()) throw new Error('Only the head admin can manage admin accounts.');
  const key = normalizeUsername(username);
  if (key === normalizeUsername(HEAD_ADMIN_SEED.username)) throw new Error('The head admin account cannot be removed.');
  if (IS_SERVER){
    await adminFetch('/api/users/delete', { username: username });
    flash = '✅ Admin account removed.';
    adminAccountsCache = null;
    await loadAdminAccounts();
  } else {
    const user = adminAccounts.users.find(u => normalizeUsername(u.username) === key);
    if (!user) throw new Error('That admin could not be found.');
    if (user.role === 'head') throw new Error('The head admin account cannot be removed.');
    adminAccounts.users = adminAccounts.users.filter(u => u !== user);
    saveAdminAccounts();
    adminAccountsCache = adminAccounts.users.map(publicLocalUser);
    recordLocalActivity('Removed admin "' + (user.display || user.username) + '"');
    flash = '✅ Admin account removed.';
    render();
  }
}
async function resetAdminPassword(username, password){
  if (!isHeadAdmin()) throw new Error('Only the head admin can manage admin accounts.');
  if (String(password || '').length < 4) throw new Error('Password must be at least 4 characters.');
  const key = normalizeUsername(username);
  if (key === normalizeUsername(HEAD_ADMIN_SEED.username)) throw new Error('Use the head admin settings to change this password.');
  if (IS_SERVER){
    await adminFetch('/api/users/reset', { username: username, password: password });
    flash = '✅ Password reset for that admin.';
    await loadAdminAccounts();
  } else {
    const user = adminAccounts.users.find(u => normalizeUsername(u.username) === key);
    if (!user) throw new Error('That admin could not be found.');
    if (user.role === 'head') throw new Error('Use the head admin settings to change this password.');
    await setLocalPassword(user, password);
    saveAdminAccounts();
    recordLocalActivity('Reset the password for admin "' + (user.display || user.username) + '"');
    flash = '✅ Password reset for that admin.';
    render();
  }
}
async function changeOwnPassword(current, next, confirmNext){
  if (!unlocked || !serverMe) throw new Error('Please log in again.');
  if (String(next || '').length < 8) throw new Error('The new password must be at least 8 characters.');
  if (String(next) !== String(confirmNext)) throw new Error('The new passwords do not match.');
  if (IS_SERVER){
    const d = await adminFetch('/api/account/password', { currentPassword: current, newPassword: next });
    applyServerSession(d, currentAdminName());
    flash = '✅ Password changed. Use the new password next time you log in.';
    passwordPanelOpen = false;
    render();
    return;
  }
  const user = adminAccounts.users.find(u => normalizeUsername(u.username) === normalizeUsername(serverMe.username));
  if (!user) throw new Error('Please log in again.');
  if (!await verifyLocalPassword(user, current)) throw new Error('Your current password is incorrect.');
  await setLocalPassword(user, next);
  saveAdminAccounts();
  applyLocalSession(user);
  recordLocalActivity('Changed their password');
  flash = '✅ Password changed. Use the new password next time you log in.';
  passwordPanelOpen = false;
  render();
}
